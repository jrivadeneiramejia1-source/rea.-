<script id="engine">
/*
 * ===================== MOTOR (sin interfaz) =====================
 * Ideas tomadas de gestores de fragmentos de código de GitHub:
 *  - massCode: etiquetas, búsqueda en todo el texto, respaldo en un archivo JSON.
 *  - Pet CLI: sincronización con un Gist usando un token con permiso "gist", por fecha de cambio.
 * Todo corre en el dispositivo. Esta app NO ejecuta scripts: los guarda, los audita,
 * los descarga como archivo y comparte su enlace o su QR para pasarlos a otro equipo.
 */
(function (root) {
  "use strict";

  const CATEGORIES = ["Audio", "Resolución/Video", "Organizador de Comunidades", "Red", "Mantenimiento"];
  const LANGS = {
    pwsh: { id: "pwsh", label: "PowerShell 7", short: "PS 7", ext: ".ps1", eol: "\r\n", bom: true },
    cmd: { id: "cmd", label: "CMD", short: "CMD", ext: ".bat", eol: "\r\n", bom: false },
    bash: { id: "bash", label: "Bash", short: "Bash", ext: ".sh", eol: "\n", bom: false },
    python: { id: "python", label: "Python", short: "Python", ext: ".py", eol: "\n", bom: false },
  };
  const INDEX_FILE = "gestor-scripts.json";

  // ---------- Utilidades ----------
  const fold = (s) => String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const str = (v, n) => (typeof v === "string" ? v.slice(0, n) : "");
  const isObj = (x) => !!x && typeof x === "object" && !Array.isArray(x);
  const slug = (s) => fold(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 48) || "script";

  // ---------- Modelo ----------
  function sanitizeScript(s) {
    if (!isObj(s) || typeof s.id !== "string" || !/^[A-Za-z0-9_-]{1,60}$/.test(s.id)) return null;
    const out = {
      id: s.id,
      name: str(s.name, 120).trim() || "Script sin nombre",
      category: CATEGORIES.includes(s.category) ? s.category : "Mantenimiento",
      lang: LANGS[s.lang] ? s.lang : "pwsh",
      tags: Array.isArray(s.tags) ? Array.from(new Set(s.tags.filter((t) => typeof t === "string").map((t) => t.trim().slice(0, 40)).filter(Boolean))).slice(0, 20) : [],
      notes: str(s.notes, 4000),
      code: str(s.code, 200000),
      createdAt: Number(s.createdAt) || Date.now(),
      updatedAt: Number(s.updatedAt) || Date.now(),
    };
    if (s.deleted === true) out.deleted = true;
    return out;
  }
  const sanitizeList = (a) => (Array.isArray(a) ? a.map(sanitizeScript).filter(Boolean) : []);

  // Une dos bibliotecas: por cada id gana el cambio más reciente (los borrados viajan como "tombstone").
  function mergeLibraries(a, b) {
    const map = new Map();
    sanitizeList(a).concat(sanitizeList(b)).forEach((s) => {
      const cur = map.get(s.id);
      if (!cur || s.updatedAt >= cur.updatedAt) map.set(s.id, s);
    });
    return Array.from(map.values());
  }
  const live = (list) => list.filter((s) => !s.deleted);

  function sanitizeGistMeta(g) {
    if (!isObj(g) || typeof g.id !== "string" || !/^[0-9a-f]{20,40}$/i.test(g.id)) return null;
    const files = {};
    if (isObj(g.files)) Object.keys(g.files).forEach((k) => { if (typeof g.files[k] === "string" && /^[\w.() -]{1,120}$/.test(g.files[k])) files[k] = g.files[k]; });
    return {
      id: g.id,
      owner: /^[A-Za-z0-9-]{1,39}$/.test(g.owner || "") ? g.owner : "",
      files: files,
      pushedAt: Number(g.pushedAt) || 0,
      htmlUrl: typeof g.htmlUrl === "string" && g.htmlUrl.indexOf("https://gist.github.com/") === 0 ? g.htmlUrl : "",
    };
  }

  const TEMPLATES = {
    pwsh: "<#\n.SYNOPSIS\n    Qué problema resuelve este script.\n#>\n$ErrorActionPreference = 'Stop'\n\ntry {\n    Write-Host 'Revisando...' -ForegroundColor Cyan\n    Write-Host 'Listo.' -ForegroundColor Green\n}\ncatch {\n    Write-Error \"Falló: $($_.Exception.Message)\"\n}\n",
    cmd: "@echo off\nchcp 65001 >nul\nsetlocal\nrem Qué problema resuelve este script.\n\necho Listo.\npause\n",
    bash: "#!/usr/bin/env bash\nset -euo pipefail\n# Qué problema resuelve este script.\n\necho \"Listo.\"\n",
    python: "\"\"\"Qué problema resuelve este script.\"\"\"\nimport sys\n\n\ndef main() -> int:\n    print(\"Listo.\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    try:\n        sys.exit(main())\n    except Exception as error:\n        print(f\"Falló: {error}\", file=sys.stderr)\n        sys.exit(1)\n",
  };
  function newScript(lang) {
    const now = Date.now();
    return { id: newId(), name: "", category: "Mantenimiento", lang: LANGS[lang] ? lang : "pwsh", tags: [], notes: "", code: TEMPLATES[LANGS[lang] ? lang : "pwsh"], createdAt: now, updatedAt: now };
  }

  const SAMPLES = /* ejemplos:start */[{"id": "s_audiosrv", "name": "Reparar servicio de audio (Audiosrv)", "category": "Audio", "lang": "pwsh", "tags": ["audio", "sonido", "servicios", "Audiosrv", "windows"], "notes": "Cuando no hay sonido o el ícono de volumen tiene una X roja. Reinicia los servicios Audiosrv y AudioEndpointBuilder.", "code": "#Requires -RunAsAdministrator\n<#\n.SYNOPSIS\n    Repara el sonido de Windows reiniciando los servicios Audiosrv y AudioEndpointBuilder.\n.DESCRIPTION\n    Úsalo cuando aparece \"No hay dispositivos de salida de audio\" o el ícono de volumen tiene una X roja.\n    Revisa que los servicios no estén deshabilitados, los reinicia en orden y muestra su estado final.\n#>\n$ErrorActionPreference = 'Stop'\n\n# #Requires no siempre se aplica con \"irm | iex\": por eso también se verifica aquí.\n$esAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)\nif (-not $esAdmin) {\n    Write-Warning 'Abre PowerShell como administrador y vuelve a ejecutar el comando.'\n    return\n}\n\n$servicios = 'AudioEndpointBuilder', 'Audiosrv'\ntry {\n    foreach ($nombre in $servicios) {\n        $svc = Get-Service -Name $nombre\n        if ($svc.StartType -eq 'Disabled') {\n            Set-Service -Name $nombre -StartupType Automatic\n            Write-Host \"El inicio de $nombre estaba deshabilitado: ahora es Automático.\" -ForegroundColor Yellow\n        }\n    }\n    # Audiosrv depende de AudioEndpointBuilder: -Force detiene ambos y luego se inician en orden.\n    Restart-Service -Name AudioEndpointBuilder -Force\n    Start-Service -Name Audiosrv\n    Start-Sleep -Seconds 2\n    Get-Service -Name $servicios | Format-Table Name, Status, StartType -AutoSize | Out-Host\n    Write-Host 'Listo. Si sigue sin sonido, revisa el dispositivo predeterminado en Configuración > Sistema > Sonido.' -ForegroundColor Green\n}\ncatch {\n    Write-Error \"No se pudo reparar el audio: $($_.Exception.Message)\"\n}\n", "createdAt": 1760000000000, "updatedAt": 1760000000000}, {"id": "s_video", "name": "Cambiar resolución o reiniciar driver de video", "category": "Resolución/Video", "lang": "pwsh", "tags": ["pantalla", "resolucion", "driver", "gpu", "video"], "notes": "Pantalla en negro, resolución rara o el equipo se ve movido. Lista resoluciones y aplica la elegida, o reinicia el adaptador de video.", "code": "<#\n.SYNOPSIS\n    Cambia la resolución de la pantalla principal o reinicia el driver de video.\n.DESCRIPTION\n    Opción 1: lista las resoluciones que acepta el monitor y aplica la que elijas (no necesita administrador).\n    Opción 2: reinicia el adaptador de video con pnputil (necesita administrador; la pantalla parpadea unos segundos).\n    Atajo manual equivalente a la opción 2: Win + Ctrl + Shift + B.\n#>\n$ErrorActionPreference = 'Stop'\n\nif (-not ('Pantalla' -as [type])) {\n    Add-Type -TypeDefinition @'\nusing System;\nusing System.Runtime.InteropServices;\npublic static class Pantalla {\n    [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]\n    public struct DEVMODE {\n        [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;\n        public short dmSpecVersion; public short dmDriverVersion; public short dmSize; public short dmDriverExtra;\n        public int dmFields; public int dmPositionX; public int dmPositionY; public int dmDisplayOrientation; public int dmDisplayFixedOutput;\n        public short dmColor; public short dmDuplex; public short dmYResolution; public short dmTTOption; public short dmCollate;\n        [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;\n        public short dmLogPixels; public int dmBitsPerPel; public int dmPelsWidth; public int dmPelsHeight;\n        public int dmDisplayFlags; public int dmDisplayFrequency; public int dmICMMethod; public int dmICMIntent;\n        public int dmMediaType; public int dmDitherType; public int dmReserved1; public int dmReserved2;\n        public int dmPanningWidth; public int dmPanningHeight;\n    }\n    [DllImport(\"user32.dll\", CharSet = CharSet.Unicode)]\n    public static extern bool EnumDisplaySettings(string deviceName, int modeNum, ref DEVMODE devMode);\n    [DllImport(\"user32.dll\", CharSet = CharSet.Unicode)]\n    public static extern int ChangeDisplaySettings(ref DEVMODE devMode, int flags);\n}\n'@\n}\n\nfunction New-Modo {\n    $m = New-Object Pantalla+DEVMODE\n    $m.dmSize = [int16][Runtime.InteropServices.Marshal]::SizeOf([type][Pantalla+DEVMODE])\n    return $m\n}\n\nfunction Get-ModosDisponibles {\n    $vistos = @{}\n    $lista = New-Object System.Collections.Generic.List[object]\n    $i = 0\n    $m = New-Modo\n    while ([Pantalla]::EnumDisplaySettings($null, $i, [ref]$m)) {\n        $res = '{0}x{1}' -f $m.dmPelsWidth, $m.dmPelsHeight\n        if ($m.dmBitsPerPel -ge 32 -and -not $vistos.ContainsKey($res)) {\n            $vistos[$res] = $true\n            $lista.Add([pscustomobject]@{ Ancho = $m.dmPelsWidth; Alto = $m.dmPelsHeight })\n        }\n        $i++\n    }\n    return $lista | Sort-Object -Property @{ Expression = { $_.Ancho * $_.Alto } } -Descending\n}\n\nfunction Set-Resolucion([int]$Ancho, [int]$Alto) {\n    $m = New-Modo\n    [void][Pantalla]::EnumDisplaySettings($null, -1, [ref]$m)   # -1 = configuración actual\n    $m.dmPelsWidth = $Ancho\n    $m.dmPelsHeight = $Alto\n    $m.dmFields = 0x00080000 -bor 0x00100000                  # DM_PELSWIDTH | DM_PELSHEIGHT\n    $prueba = [Pantalla]::ChangeDisplaySettings([ref]$m, 0x02)  # CDS_TEST: solo comprueba\n    if ($prueba -ne 0) { throw \"La pantalla no acepta ${Ancho}x$Alto (código $prueba).\" }\n    $resultado = [Pantalla]::ChangeDisplaySettings([ref]$m, 0x01)  # CDS_UPDATEREGISTRY: aplica y guarda\n    switch ($resultado) {\n        0 { Write-Host \"Resolución cambiada a ${Ancho}x$Alto.\" -ForegroundColor Green }\n        1 { Write-Host 'Cambio guardado: reinicia el equipo para aplicarlo.' -ForegroundColor Yellow }\n        default { throw \"Windows rechazó el cambio (código $resultado).\" }\n    }\n}\n\nfunction Restart-DriverVideo {\n    $esAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)\n    if (-not $esAdmin) {\n        Write-Warning 'Para reiniciar el driver abre PowerShell como administrador.'\n        return\n    }\n    $gpus = @(Get-PnpDevice -Class Display -PresentOnly | Where-Object Status -eq 'OK')\n    if ($gpus.Count -eq 0) {\n        Write-Warning 'No encontré adaptadores de video activos.'\n        return\n    }\n    foreach ($g in $gpus) {\n        Write-Host \"Reiniciando $($g.FriendlyName)...\" -ForegroundColor Cyan\n        pnputil /restart-device \"$($g.InstanceId)\" | Out-Null\n        if ($LASTEXITCODE -ne 0) {\n            # Windows anterior a 10 2004 no tiene /restart-device: se deshabilita y se vuelve a habilitar.\n            Disable-PnpDevice -InstanceId $g.InstanceId -Confirm:$false\n            Start-Sleep -Seconds 3\n            Enable-PnpDevice -InstanceId $g.InstanceId -Confirm:$false\n        }\n    }\n    Write-Host 'Driver de video reiniciado.' -ForegroundColor Green\n}\n\ntry {\n    $actual = New-Modo\n    [void][Pantalla]::EnumDisplaySettings($null, -1, [ref]$actual)\n    Write-Host (\"Resolución actual: {0}x{1} a {2} Hz\" -f $actual.dmPelsWidth, $actual.dmPelsHeight, $actual.dmDisplayFrequency)\n    Write-Host '1) Cambiar resolución'\n    Write-Host '2) Reiniciar driver de video (administrador)'\n    $opcion = Read-Host 'Elige 1 o 2'\n    switch ($opcion) {\n        '1' {\n            $modos = @(Get-ModosDisponibles | Select-Object -First 12)\n            for ($n = 0; $n -lt $modos.Count; $n++) { Write-Host (\"{0,2}) {1}x{2}\" -f ($n + 1), $modos[$n].Ancho, $modos[$n].Alto) }\n            $eleccion = Read-Host 'Número de la resolución'\n            $idx = 0\n            if (-not [int]::TryParse($eleccion, [ref]$idx) -or $idx -lt 1 -or $idx -gt $modos.Count) { throw 'Número inválido.' }\n            Set-Resolucion -Ancho $modos[$idx - 1].Ancho -Alto $modos[$idx - 1].Alto\n        }\n        '2' { Restart-DriverVideo }\n        default { Write-Host 'Sin cambios.' }\n    }\n}\ncatch {\n    Write-Error \"No se pudo completar: $($_.Exception.Message)\"\n}\n", "createdAt": 1760000000001, "updatedAt": 1760000000001}, {"id": "s_organizar", "name": "Organizar carpeta por tipo de archivo", "category": "Organizador de Comunidades", "lang": "pwsh", "tags": ["organizar", "descargas", "archivos", "orden", "carpetas"], "notes": "Carpeta de Descargas desordenada. Mueve cada archivo a subcarpetas (Imágenes, Documentos, Videos...). Muestra vista previa y pide confirmar.", "code": "<#\n.SYNOPSIS\n    Ordena una carpeta (por defecto, Descargas) moviendo cada archivo a una subcarpeta según su tipo.\n.DESCRIPTION\n    Primero muestra una vista previa y solo mueve si escribes SI. No entra a subcarpetas, no toca\n    archivos ocultos ni del sistema, y si ya existe un archivo con el mismo nombre agrega (1), (2)...\n#>\n$ErrorActionPreference = 'Stop'\n\nfunction Get-CarpetaDescargas {\n    $clave = 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\User Shell Folders'\n    $guid = '{374DE290-123F-4565-9164-39C4925E467B}'\n    if (Test-Path -LiteralPath $clave) {\n        $valor = (Get-ItemProperty -LiteralPath $clave -Name $guid -ErrorAction SilentlyContinue).$guid\n        if ($valor) { return [Environment]::ExpandEnvironmentVariables($valor) }\n    }\n    return Join-Path ([Environment]::GetFolderPath('UserProfile')) 'Downloads'\n}\n\n$tipos = [ordered]@{\n    'Imagenes'     = '.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp', '.heic', '.svg', '.ico'\n    'Documentos'   = '.pdf', '.doc', '.docx', '.txt', '.rtf', '.odt', '.xls', '.xlsx', '.csv', '.ppt', '.pptx'\n    'Videos'       = '.mp4', '.mkv', '.avi', '.mov', '.wmv', '.webm'\n    'Audio'        = '.mp3', '.wav', '.flac', '.m4a', '.ogg', '.aac'\n    'Comprimidos'  = '.zip', '.rar', '.7z', '.tar', '.gz', '.iso'\n    'Instaladores' = '.exe', '.msi', '.msix', '.appx', '.apk'\n    'Codigo'       = '.ps1', '.bat', '.cmd', '.py', '.sh', '.js', '.json', '.html', '.css', '.xml'\n}\n$destinoDe = @{}\nforeach ($t in $tipos.Keys) { foreach ($ext in $tipos[$t]) { $destinoDe[$ext] = $t } }\n\nfunction Get-RutaLibre([string]$Carpeta, [string]$Nombre) {\n    $ruta = Join-Path $Carpeta $Nombre\n    $base = [IO.Path]::GetFileNameWithoutExtension($Nombre)\n    $ext = [IO.Path]::GetExtension($Nombre)\n    $n = 1\n    while (Test-Path -LiteralPath $ruta) {\n        $ruta = Join-Path $Carpeta (\"{0} ({1}){2}\" -f $base, $n, $ext)\n        $n++\n    }\n    return $ruta\n}\n\ntry {\n    $porDefecto = Get-CarpetaDescargas\n    $entrada = Read-Host \"Carpeta a ordenar (Enter = $porDefecto)\"\n    $carpeta = if ([string]::IsNullOrWhiteSpace($entrada)) { $porDefecto } else { $entrada.Trim('\"', ' ') }\n    if (-not (Test-Path -LiteralPath $carpeta -PathType Container)) { throw \"No existe la carpeta: $carpeta\" }\n\n    $archivos = @(Get-ChildItem -LiteralPath $carpeta -File | Where-Object {\n        -not ($_.Attributes -band [IO.FileAttributes]::Hidden) -and -not ($_.Attributes -band [IO.FileAttributes]::System)\n    })\n    if ($archivos.Count -eq 0) { Write-Host 'No hay archivos para ordenar.'; return }\n\n    $plan = foreach ($a in $archivos) {\n        $tipo = $destinoDe[$a.Extension.ToLowerInvariant()]\n        if (-not $tipo) { $tipo = 'Otros' }\n        [pscustomobject]@{ Archivo = $a; Tipo = $tipo }\n    }\n    Write-Host \"`nVista previa en ${carpeta}:\" -ForegroundColor Cyan\n    $plan | Group-Object Tipo | Sort-Object Count -Descending | Format-Table @{ n = 'Carpeta'; e = { $_.Name } }, @{ n = 'Archivos'; e = { $_.Count } } -AutoSize | Out-Host\n\n    if ((Read-Host 'Escribe SI para mover los archivos') -ne 'SI') { Write-Host 'Cancelado: no se movió nada.'; return }\n\n    $movidos = 0\n    $fallidos = 0\n    foreach ($p in $plan) {\n        try {\n            $destino = Join-Path $carpeta $p.Tipo\n            if (-not (Test-Path -LiteralPath $destino)) { New-Item -ItemType Directory -Path $destino | Out-Null }\n            Move-Item -LiteralPath $p.Archivo.FullName -Destination (Get-RutaLibre $destino $p.Archivo.Name)\n            $movidos++\n        }\n        catch {\n            $fallidos++\n            Write-Warning \"No se movió $($p.Archivo.Name): $($_.Exception.Message)\"\n        }\n    }\n    Write-Host \"Listo: $movidos movidos, $fallidos con error (por ejemplo, archivos abiertos).\" -ForegroundColor Green\n}\ncatch {\n    Write-Error \"No se pudo ordenar la carpeta: $($_.Exception.Message)\"\n}\n", "createdAt": 1760000000002, "updatedAt": 1760000000002}]/* ejemplos:end */;

  // ---------- Búsqueda aproximada (fuzzy) ----------
  function withinOneEdit(a, b) {
    if (a === b) return true;
    const la = a.length, lb = b.length;
    if (Math.abs(la - lb) > 1) return false;
    let i = 0, j = 0, edits = 0;
    while (i < la && j < lb) {
      if (a[i] === b[j]) { i++; j++; continue; }
      if (++edits > 1) return false;
      if (la > lb) i++; else if (lb > la) j++; else { i++; j++; }
    }
    return edits + (la - i) + (lb - j) <= 1;
  }
  function subsequence(token, text) {
    let k = 0;
    for (let i = 0; i < text.length && k < token.length; i++) if (text[i] === token[k]) k++;
    return k === token.length;
  }
  function scoreScript(s, tokens) {
    const name = fold(s.name), tags = s.tags.map(fold), cat = fold(s.category), notes = fold(s.notes), code = fold(s.code);
    const words = (name + " " + tags.join(" ")).split(/[^a-z0-9]+/).filter(Boolean);
    let total = 0;
    for (const t of tokens) {
      let best = 0;
      if (name.includes(t)) best = Math.max(best, words.some((w) => w.indexOf(t) === 0) ? 14 : 10);
      if (tags.some((x) => x.includes(t))) best = Math.max(best, 8);
      if (cat.includes(t)) best = Math.max(best, 6);
      if (notes.includes(t)) best = Math.max(best, 4);
      if (t.length >= 4 && words.some((w) => withinOneEdit(w, t) || (w.length > t.length && withinOneEdit(w.slice(0, t.length), t)))) best = Math.max(best, 5);
      if (code.includes(t)) best = Math.max(best, 2);
      if (t.length >= 3 && subsequence(t, name.replace(/\s+/g, ""))) best = Math.max(best, 2);
      if (!best) return 0;
      total += best;
    }
    return total;
  }
  function search(list, query, filters) {
    const f = filters || {};
    const pool = live(list).filter((s) => (!f.category || s.category === f.category) && (!f.lang || s.lang === f.lang));
    const tokens = fold(query).split(/\s+/).filter(Boolean);
    if (!tokens.length) return pool.slice().sort((a, b) => b.updatedAt - a.updatedAt);
    return pool.map((s) => ({ s: s, k: scoreScript(s, tokens) })).filter((x) => x.k > 0)
      .sort((a, b) => b.k - a.k || b.s.updatedAt - a.s.updatedAt).map((x) => x.s);
  }

  // ---------- Archivos ----------
  function fileName(s) { return slug(s.name) + "-" + s.id.slice(-5) + LANGS[s.lang].ext; }
  function normalizedCode(s) {
    const L = LANGS[s.lang];
    let text = String(s.code || "").replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
    if (!text.endsWith("\n")) text += "\n";
    return text.replace(/\n/g, L.eol);
  }
  const utf8 = (text) => new TextEncoder().encode(text);
  function fileBytes(s) {
    const body = utf8(normalizedCode(s));
    if (!LANGS[s.lang].bom) return body;
    // .ps1 con BOM (firma UTF-8): así Windows PowerShell 5.1 lee bien las tildes y la ñ.
    const out = new Uint8Array(body.length + 3);
    out.set([0xef, 0xbb, 0xbf]); out.set(body, 3);
    return out;
  }
  function bytesToBase64(bytes) {
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }

  function rawUrl(meta, scriptId) {

  }

  // ---------- ZIP sin compresión (las descargas de claude.ai no admiten .ps1/.bat/.py/.sh sueltos) ----------
  let CRC_TABLE = null;
  function crc32(bytes) {
    if (!CRC_TABLE) {
      CRC_TABLE = new Uint32Array(256);
      for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; CRC_TABLE[n] = c >>> 0; }
    }
    let crc = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 255] ^ (crc >>> 8);
    return (crc ^ 0xffffffff) >>> 0;
  }
  function zipStore(files) {
    const parts = [], central = [];
    let offset = 0;
    const d = new Date();
    const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    for (const f of files) {
      const name = utf8(f.name), data = f.bytes, crc = crc32(data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true);
      local.setUint16(10, dosTime, true); local.setUint16(12, dosDate, true);
      local.setUint32(14, crc, true); local.setUint32(18, data.length, true); local.setUint32(22, data.length, true);
      local.setUint16(26, name.length, true);
      parts.push(new Uint8Array(local.buffer), name, data);
      const cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint16(8, 0x0800, true);
      cen.setUint16(12, dosTime, true); cen.setUint16(14, dosDate, true);
      cen.setUint32(16, crc, true); cen.setUint32(20, data.length, true); cen.setUint32(24, data.length, true);
      cen.setUint16(28, name.length, true); cen.setUint32(42, offset, true);
      central.push(new Uint8Array(cen.buffer), name);
      offset += 30 + name.length + data.length;
    }
    const cenSize = central.reduce((n, p) => n + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cenSize, true); end.setUint32(16, offset, true);
    const all = parts.concat(central, [new Uint8Array(end.buffer)]);
    const out = new Uint8Array(all.reduce((n, p) => n + p.length, 0));
    let pos = 0;
    all.forEach((p) => { out.set(p, pos); pos += p.length; });
    return out;
  }

  // ---------- Auditor ----------
  const ADMIN_PS =
    "$esAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)\n" +
    "if (-not $esAdmin) {\n    Write-Warning 'Abre PowerShell como administrador y vuelve a ejecutar.'\n    return\n}\n";
  const ADMIN_CMD = "net session >nul 2>&1\nif %errorlevel% neq 0 (\n    echo Ejecuta este archivo como administrador: clic derecho, Ejecutar como administrador.\n    pause\n    exit /b 1\n)\n";
  const PS_ADMIN_CMDS = /\b(Set-Service|Restart-Service|Stop-Service|Start-Service|New-Service|Remove-Service|Set-NetAdapter\w*|Restart-NetAdapter|Disable-NetAdapter|Enable-NetAdapter|Set-DnsClientServerAddress|Set-NetIPAddress|New-NetIPAddress|Disable-PnpDevice|Enable-PnpDevice|Set-MpPreference|Add-MpPreference|Enable-WindowsOptionalFeature|Disable-WindowsOptionalFeature|Repair-WindowsImage|Register-ScheduledTask|Set-TimeZone|Rename-Computer|Add-Computer|Clear-EventLog)\b|\b(sfc|dism|bcdedit|pnputil|netsh|w32tm|chkdsk|diskpart|wevtutil)(\.exe)?\b|HKLM:|HKEY_LOCAL_MACHINE|\bnet\s+(stop|start|user|localgroup)\b|\bsc(\.exe)?\s+(config|stop|start|delete)\b/i;
  const CMD_ADMIN_CMDS = /\b(net\s+(stop|start|user|localgroup)|sc\s+(config|stop|start|delete)|reg\s+(add|delete)\s+HKLM|netsh|sfc|dism|bcdedit|pnputil|diskpart|chkdsk|w32tm|wevtutil)\b/i;
  const SECRET = /(password|passwd|contrase(ñ|n)a|clave|token|api[_-]?key|secret)\s*[:=]\s*['"][^'"\s]{4,}['"]/i;
  const hasHereString = (code) => /@['"]\s*\r?\n/.test(code);

  function matchClose(s, open) {
    const want = s[open] === "(" ? ")" : "]";
    let depth = 0;
    for (let i = open; i < s.length; i++) {
      const c = s[i];
      if (c === "'" || c === '"') { const e = s.indexOf(c, i + 1); if (e < 0) return -1; i = e; continue; }
      if (c === "#" && s[i - 1] !== "<") { const e = s.indexOf("\n", i); if (e < 0) return -1; i = e; continue; }
      if (c === s[open]) depth++;
      else if (c === want && --depth === 0) return i;
    }
    return -1;
  }
  // Separa el encabezado de PowerShell (comentarios, #Requires, using, [CmdletBinding()], param(...)) del cuerpo.
  function splitPsPrologue(code) {
    const s = String(code || "");
    let i = 0;
    for (;;) {
      while (i < s.length && /\s/.test(s[i])) i++;
      const rest = s.slice(i, i + 40);
      if (s.startsWith("<#", i)) { const e = s.indexOf("#>", i + 2); if (e < 0) break; i = e + 2; continue; }
      if (s[i] === "#") { const e = s.indexOf("\n", i); i = e < 0 ? s.length : e + 1; continue; }
      if (/^using\s+(namespace|module|assembly)\b/i.test(rest)) { const e = s.indexOf("\n", i); i = e < 0 ? s.length : e + 1; continue; }
      if (/^\[CmdletBinding/i.test(rest)) { const e = matchClose(s, i); if (e < 0) break; i = e + 1; continue; }
      if (/^param\s*\(/i.test(rest)) { const e = matchClose(s, s.indexOf("(", i)); if (e < 0) break; i = e + 1; continue; }
      break;
    }
    const cut = i >= s.length ? s.length : s.lastIndexOf("\n", i - 1) + 1;
    return { head: s.slice(0, cut), body: s.slice(cut) };
  }
  const ensureNl = (s) => (s && !s.endsWith("\n") ? s + "\n" : s);

  const FIXES = {
    psAdmin: (code) => { const p = splitPsPrologue(code); return ensureNl(p.head) + ADMIN_PS + "\n" + p.body.replace(/^\n+/, ""); },
    psRequires: (code) => "#Requires -RunAsAdministrator\n" + code,
    psStop: (code) => { const p = splitPsPrologue(code); return ensureNl(p.head) + "$ErrorActionPreference = 'Stop'\n\n" + p.body.replace(/^\n+/, ""); },
    psTry: (code) => {

    [/[a-z]:\\users\\[^\\'"\s]+\\appdata\\local\\temp/i, "$env:TEMP", "%TEMP%", "tempfile.gettempdir()"],

  function audit(s) {

    const checks = [];

      if (paths.length) add(paths.some((p) => /users/i.test(p.text)) ? "fail" : "warn", "Rutas fijas", "Cámbialas por rutas dinámicas: " + paths.map((p) => p.text + " → " + p.use).join("; ") + ". Ojo: con comillas simples $env no se expande; usa comillas dobles o Join-Path.");

      if (/\bRemove-Item\b[^\n]*-Recurse|\bFormat-Volume\b|\bClear-Disk\b|\bRemove-Partition\b|\bStop-Computer\b|\bRestart-Computer\b/i.test(code) && !/-WhatIf|-Confirm(?!:\$false)|Read-Host/i.test(code))

      if (!/^\s*@echo off/i.test(code)) add("warn", "Falta @echo off", "Sin esa línea la consola muestra cada comando y confunde al usuario.", { id: "cmdEcho", label: "Agregar @echo off" });
      const needsAdmin = CMD_ADMIN_CMDS.test(code);
      const hasCheck = /net session\s*>\s*nul|fltmc\s*>\s*nul|openfiles\s*>\s*nul/i.test(code);
      if (needsAdmin && !hasCheck) add("fail", "Falta pedir permisos de administrador", "Usa comandos que necesitan administrador. Agrega la verificación con net session.", { id: "cmdAdmin", label: "Agregar verificación de administrador" });

      const paths = fixedPaths(code, 2);
      if (paths.length) add("fail", "Rutas fijas", "Cámbialas por: " + paths.map((p) => p.text + " → " + p.use).join("; ") + ".");
      else add("ok", "Sin rutas fijas", "No encontré rutas escritas a mano.");
      if (/[^\x00-\x7f]/.test(code) && !/chcp\s+65001/i.test(code)) add("warn", "Tiene tildes o ñ sin chcp 65001", "La consola puede mostrar caracteres raros.", { id: "cmdChcp", label: "Agregar chcp 65001" });
    }

    if (s.lang === "python") {
      if (/\btry\s*:/.test(code) && /\bexcept\b/.test(code)) add("ok", "Maneja errores", "Tiene try/except.");
      else add("fail", "Sin manejo de errores (try/except)", "Envuelve la parte principal en try/except y muestra el error en español.");

  // ---------- GitHub Gists (API REST) ----------
  class GistError extends Error { constructor(code, message) { super(message); this.code = code; } }
  async function gh(token, method, path, body) {

<script id="app">

  // ---------- Nube de Claude (capacidad db): datos privados de tu cuenta, celular y PC ----------
  function useClaudeCloud(onRemote) {
    const [state, setState] = useState({ status: IN_CLAUDE ? "conectando" : "local", detail: "" });
    const colRef = useRef(null);
    const queue = useRef(Promise.resolve());
    const cb = useRef(onRemote); cb.current = onRemote;
    useEffect(() => {
      if (!IN_CLAUDE) return undefined;

        try {
          const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
          const uid = user ? await user.id() : null;
          if (cancelled) return;
          if (!db || !uid) { setState({ status: "local", detail: "Inicia sesión en claude.ai para sincronizar entre celular y PC." }); return; }
          const col = db.collection("data/users/" + uid);
          colRef.current = col;

        } catch (e) {

        setState({ status: "error", detail: e && e.code === "quota_exceeded" ? "La nube de Claude está llena: borra scripts que no uses." : "No se pudo guardar en la nube de Claude." });

  // ---------- Portapapeles y descargas ----------
  async function copyText(text) {

  let downloadsP = null;

        if (e && e.code === "declined") return "Descarga cancelada.";

  // En claude.ai solo se permiten ciertas extensiones: el script va dentro de un .zip con su extensión real.

    if (viaCapability) return saveFile(name.replace(/\.\w+$/, "") + ".zip", new Blob([G.zipStore([{ name: name, bytes: bytes }])]), "application/zip");
    return saveFile(name, new Blob([bytes]), "text/plain");
  }

  // ---------- Piezas de interfaz ----------
  function Icon({ name, size = 20, className = "" }) {
    const C = window.LucideReact && window.LucideReact[name];
    if (!C) return html`<span className=${"inline-block rounded-sm bg-current opacity-40 " + className} style=${{ width: size * 0.5, height: size * 0.5 }} aria-hidden="true"></span>`;
    return html`<${C} size=${size} className=${className} aria-hidden="true" />`;
  }
  const BTN = {
    primary: "bg-acc text-acc-ink border-acc hover:brightness-110",
    ghost: "bg-raised text-ink border-line hover:bg-line",
    danger: "bg-raised text-bad border-bad/60 hover:bg-line",
    subtle: "bg-transparent text-mute border-transparent hover:bg-raised hover:text-ink",
  };
  function Btn({ kind = "ghost", icon, children, onClick, disabled, label, className = "", small, pressed, type = "button" }) {
    return html`<button type=${type} onClick=${onClick} disabled=${disabled} aria-label=${label} title=${label} aria-pressed=${pressed}
      className=${"inline-flex items-center justify-center gap-2 rounded-xl border font-semibold transition select-none disabled:opacity-40 disabled:cursor-not-allowed " +
        (small ? "min-h-[40px] px-3 text-sm " : "min-h-[48px] px-4 ") + BTN[kind] + " " + className}>
      ${icon && html`<${Icon} name=${icon} size=${small ? 18 : 20} />`}${children}
    </button>`;
  }
  function ConfirmBtn({ onConfirm, children, icon = "Trash2", confirmText = "Toca otra vez para confirmar", small = true }) {
    const [armed, setArmed] = useState(false);
    useEffect(() => { if (!armed) return undefined; const t = setTimeout(() => setArmed(false), 4000); return () => clearTimeout(t); }, [armed]);
    return html`<${Btn} kind="danger" icon=${icon} small=${small} onClick=${() => { if (armed) { setArmed(false); onConfirm(); } else setArmed(true); }}>${armed ? confirmText : children}<//>`;
  }
  const INPUT = "w-full min-h-[48px] rounded-xl border border-line bg-canvas px-3 py-2 text-ink placeholder:text-faint focus:border-acc focus:outline-none";
  function Field({ id, label, children, hint }) {
    return html`<div className="grid gap-1.5 min-w-0">
      <label htmlFor=${id} className="text-xs font-bold uppercase tracking-wider text-mute">${label}</label>
      ${children}
      ${hint && html`<p className="m-0 text-xs text-faint">${hint}</p>`}
    </div>`;
  }
  function Chip({ children, tone = "line" }) {
    const tones = { line: "border-line text-mute", acc: "border-acc/60 text-acc", info: "border-info/60 text-info" };
    return html`<span className=${"inline-flex items-center rounded-md border px-2 py-0.5 text-xs font-semibold " + tones[tone]}>${children}</span>`;
  }
  const LANG_TONE = { pwsh: "info", cmd: "line", bash: "acc", python: "acc" };
  const CAT_ICON = { "Audio": "Volume2", "Resolución/Video": "Monitor", "Organizador de Comunidades": "Users", "Red": "Network", "Mantenimiento": "Wrench" };
  const fmtDate = (ts) => new Date(ts).toLocaleString("es-CO", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  const ST = { ok: { c: "text-good", i: "CheckCircle2" }, warn: { c: "text-warn", i: "AlertTriangle" }, fail: { c: "text-bad", i: "XCircle" }, info: { c: "text-info", i: "Info" } };

  // Código QR en SVG (fondo blanco obligatorio para que se pueda escanear).
  function QR({ text }) {
    const data = useMemo(() => {
      if (!window.qrcode) return { error: "No se pudo cargar el generador de QR. Revisa tu conexión y recarga." };
      try {
        const q = window.qrcode(0, "M");
        q.addData(text, "Byte");
        q.make();
        const n = q.getModuleCount();
        let path = "";
        for (let r = 0; r < n; r++) {
          let c = 0;
          while (c < n) {
            if (!q.isDark(r, c)) { c++; continue; }
            let w = 1;
            while (c + w < n && q.isDark(r, c + w)) w++;
            path += "M" + (c + 4) + " " + (r + 4) + "h" + w + "v1h-" + w + "z";
            c += w;
          }
        }
        return { n: n + 8, path: path };
      } catch (e) {
        return { error: "El texto es demasiado largo para un QR (" + new TextEncoder().encode(text).length + " bytes; el máximo ronda los 2.300). Usa el enlace del Gist, que es corto, o descarga el archivo." };
      }
    }, [text]);
    if (data.error) return html`<p className="m-0 rounded-xl border border-warn/50 bg-raised p-3 text-sm text-warn">${data.error}</p>`;
    return html`<div className="grid justify-items-center gap-2">
      <svg viewBox=${"0 0 " + data.n + " " + data.n} className="w-full max-w-[300px] rounded-lg bg-white" role="img" aria-label="Código QR" shapeRendering="crispEdges">
        <rect width=${data.n} height=${data.n} fill="#ffffff" />
        <path d=${data.path} fill="#000000" />
      </svg>
      ${data.n - 8 > 61 && html`<p className="m-0 text-xs text-warn">QR denso: acerca bien la cámara.</p>`}
    </div>`;
  }
  function QrModal({ title, text, onClose, notify }) {
    return html`<div role="dialog" aria-modal="true" aria-label=${"QR de " + title} className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4" onClick=${onClose}>
      <div className="grid max-h-[90vh] w-full max-w-sm gap-3 overflow-auto rounded-2xl border border-line bg-panel p-4" onClick=${(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between gap-2"><h3 className="m-0 text-base font-bold">${title}</h3>
          <${Btn} kind="subtle" small icon="X" label="Cerrar" onClick=${onClose} /></div>
        <${QR} text=${text} />
        <pre className="wrap code m-0 max-h-24 overflow-auto rounded-xl border border-line bg-canvas p-2 text-xs text-mute">${text}</pre>
        <${Btn} kind="ghost" small icon="Copy" onClick=${async () => notify((await copyText(text)) ? "Copiado." : "No se pudo copiar.")}>Copiar el texto del QR<//>
      </div>
    </div>`;
  }

  // ---------- Detalle: Compartir ----------
  function ShareTab({ s, gist, notify, openQR }) {
    const url = G.rawUrl(gist, s.id);
    const stale = url && gist && s.updatedAt > gist.pushedAt + 1000;
    const bytes = useMemo(() => G.utf8(G.normalizedCode(s)).length, [s.code, s.lang]);
    return html`<div className="grid gap-5">
      <section className="grid gap-3">
        <h3 className="m-0 flex items-center gap-2 text-base font-bold"><${Icon} name="Download" className="text-acc" />Descargar el archivo</h3>
        <p className="m-0 text-sm text-mute">Descarga <span className="code text-ink">${G.fileName(s)}</span> con su extensión real para ejecutarlo en el PC. Dentro de claude.ai llega en un <b>.zip</b> (abre el zip y dentro está el ${G.LANGS[s.lang].ext}); en la versión para PC baja directo.</p>
        <div className="grid grid-cols-2 gap-2">
          <${Btn} kind="primary" icon="Download" onClick=${async () => notify(await downloadScript(s))}>Descargar<//>
          <${Btn} icon="Copy" onClick=${async () => notify((await copyText(G.normalizedCode(s).replace(/\r\n/g, "\n"))) ? "Código copiado." : "No se pudo copiar.")}>Copiar código<//>
        </div>
      </section>

      <section className="grid gap-3">
        <h3 className="m-0 flex items-center gap-2 text-base font-bold"><${Icon} name="QrCode" className="text-acc" />Pasar al otro PC</h3>
        ${url ? html`<div className="grid gap-3">
            ${stale && html`<p className="m-0 flex gap-2 rounded-xl border border-warn/50 bg-raised p-3 text-sm text-warn"><${Icon} name="AlertTriangle" size=${16} className="mt-0.5 shrink-0" />Cambiaste el script después de la última subida. Haz «Subir a la nube» en Ajustes para que el enlace tenga la versión nueva.</p>`}
            <p className="m-0 text-sm text-mute">Enlace directo a tu Gist (archivo crudo). Ábrelo en el navegador del otro PC para ver y descargar el script. <b>Revisa siempre el código antes de ejecutarlo.</b></p>
            <pre className="wrap code m-0 max-h-24 overflow-auto rounded-xl border border-line bg-canvas p-3 text-xs text-ink">${url}</pre>
            <div className="grid grid-cols-2 gap-2">
              <${Btn} kind="primary" icon="QrCode" onClick=${() => openQR("Enlace del script", url)}>Mostrar QR<//>
              <${Btn} icon="Copy" onClick=${async () => notify((await copyText(url)) ? "Enlace copiado." : "No se pudo copiar.")}>Copiar enlace<//>
            </div>
            ${gist.htmlUrl && html`<a href=${gist.htmlUrl} target="_blank" rel="noopener" className="text-sm text-info underline">Ver el Gist completo en GitHub</a>`}
          </div>`
          : html`<div className="grid gap-3 rounded-2xl border border-dashed border-line p-4 text-sm text-mute">
            <p className="m-0">Para generar un enlace y su QR, sincroniza tu biblioteca con un Gist de GitHub (en Ajustes). Mientras tanto, descarga el archivo y pásalo por USB, WhatsApp o tu nube.</p>
            ${bytes <= 1800 ? html`<p className="m-0">O comparte el código como texto en un QR (el otro equipo lo lee y lo pega en un editor; no se ejecuta solo):</p>
              <${Btn} icon="QrCode" onClick=${() => openQR("Código de " + (s.name || "script"), G.normalizedCode(s).replace(/\r\n/g, "\n"))}>QR con el código (texto)<//>`
              : html`<p className="m-0 text-faint">El código es muy largo para un QR de texto (${bytes} bytes). Usa la descarga o sincroniza con Gist.</p>`}
          </div>`}
      </section>
    </div>`;
  }

  // ---------- Detalle: Auditoría ----------
  function AuditTab({ s, onApplyFix, notify }) {
    const result = useMemo(() => G.audit(s), [s.code, s.lang]);
    const links = G.searchLinks(s);
    const color = result.score >= 75 ? "#3ddc84" : result.score >= 50 ? "#f0b44c" : "#f07a62";
    return html`<div className="grid gap-4">
      <div className="flex items-center gap-4 rounded-2xl border border-line bg-panel p-4">
        <div className="relative grid h-16 w-16 shrink-0 place-items-center">
          <svg viewBox="0 0 36 36" className="h-16 w-16 -rotate-90"><circle cx="18" cy="18" r="15" fill="none" stroke="#1b2b25" strokeWidth="4" />
            <circle cx="18" cy="18" r="15" fill="none" stroke=${color} strokeWidth="4" strokeLinecap="round" strokeDasharray=${2 * Math.PI * 15} strokeDashoffset=${2 * Math.PI * 15 * (1 - result.score / 100)} /></svg>

      </div>

          <div className="flex gap-2"><${Icon} name=${ST[c.status].i} size=${18} className=${ST[c.status].c + " mt-0.5 shrink-0"} />
            <div className="min-w-0"><p className=${"m-0 font-semibold " + ST[c.status].c}>${c.title}</p><p className="m-0 text-sm text-mute">${c.detail}</p></div></div>
          ${c.fix && html`<${Btn} small kind="ghost" icon="Wand2" className="justify-self-start" onClick=${() => { onApplyFix(c.fix.id); notify("Corregido: " + c.fix.label.toLowerCase() + ". Revísalo en «Código»."); }}>${c.fix.label}<//>`}
        </li>`)}
      </ul>
      <section className="grid gap-2">
        <h3 className="m-0 flex items-center gap-2 text-base font-bold"><${Icon} name="Search" className="text-acc" />Buscar soluciones</h3>
        <div className="grid gap-2 sm:grid-cols-3">
          ${links.map((l) => html`<a key=${l.url} href=${l.url} target="_blank" rel="noopener" className="flex min-h-[48px] items-center justify-center gap-2 rounded-xl border border-line bg-raised px-3 text-sm font-semibold hover:bg-line"><${Icon} name="ExternalLink" size=${16} />${l.label}</a>`)}
        </div>
      </section>
    </div>`;
  }

  // ---------- Detalle: Código (editor + metadatos) ----------
  function EditTab({ s, patch, notify }) {
    const [tag, setTag] = useState("");
    const addTag = () => { const t = tag.trim(); if (t && !s.tags.includes(t)) patch({ tags: s.tags.concat(t).slice(0, 20) }); setTag(""); };
    return html`<div className="grid gap-4">
      <div className="grid gap-4 sm:grid-cols-2">
        <${Field} id="f-name" label="Nombre">
          <input id="f-name" type="text" value=${s.name} onChange=${(e) => patch({ name: e.target.value })} className=${INPUT} placeholder="Ej.: Reparar servicio de audio" />
        <//>
        <${Field} id="f-cat" label="Categoría">
          <select id="f-cat" value=${s.category} onChange=${(e) => patch({ category: e.target.value })} className=${INPUT}>
            ${G.CATEGORIES.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}
          </select>
        <//>
        <${Field} id="f-lang" label="Lenguaje">
          <select id="f-lang" value=${s.lang} onChange=${(e) => patch({ lang: e.target.value })} className=${INPUT}>
            ${Object.keys(G.LANGS).map((k) => html`<option key=${k} value=${k}>${G.LANGS[k].label} (${G.LANGS[k].ext})</option>`)}
          </select>
        <//>
        <${Field} id="f-tag" label="Etiquetas (tags)">
          <div className="flex gap-2"><input id="f-tag" type="text" value=${tag} onChange=${(e) => setTag(e.target.value)} onKeyDown=${(e) => { if (e.key === "Enter") { e.preventDefault(); addTag(); } }} className=${INPUT + " min-w-0 flex-1"} placeholder="Escribe y Enter" />
            <${Btn} small icon="Plus" label="Agregar etiqueta" onClick=${addTag} /></div>
          ${s.tags.length > 0 && html`<div className="flex flex-wrap gap-1.5 pt-1">${s.tags.map((t) => html`<button key=${t} type="button" onClick=${() => patch({ tags: s.tags.filter((x) => x !== t) })} className="inline-flex items-center gap-1 rounded-md border border-line bg-raised px-2 py-1 text-xs hover:border-bad hover:text-bad">${t}<${Icon} name="X" size=${12} /></button>`)}</div>`}
        <//>
      </div>
      <${Field} id="f-notes" label="¿Qué problema resuelve? (notas)">
        <textarea id="f-notes" rows="2" value=${s.notes} onChange=${(e) => patch({ notes: e.target.value })} className=${INPUT} placeholder="Ej.: cuando no hay sonido y el ícono de volumen tiene una X roja."></textarea>
      <//>
      <${Field} id="f-code" label=${"Código (" + G.LANGS[s.lang].label + ")"} hint=${"Al descargar y al subir al Gist se normaliza el fin de línea" + (G.LANGS[s.lang].bom ? " y se agrega la firma UTF-8 para que las tildes salgan bien en Windows." : ".")}>
        <textarea id="f-code" rows="16" spellCheck="false" value=${s.code} onChange=${(e) => patch({ code: e.target.value })} className=${INPUT + " code min-h-[320px] text-[13px] leading-relaxed"}></textarea>
      <//>
    </div>`;
  }

  function Detail({ s, gist, tab, setTab, patch, applyFix, notify, openQR, onClose, onDelete }) {
    const TABS = [["compartir", "Compartir", "Share2"], ["codigo", "Código", "Code2"], ["auditoria", "Auditoría", "ShieldCheck"]];

      <div className="flex items-start justify-between gap-2">
        <div className="min-w-0">
          <div className="flex flex-wrap items-center gap-2"><${Chip} tone=${LANG_TONE[s.lang]}>${G.LANGS[s.lang].short}<//><${Chip}>${s.category}<//></div>
          <h2 className="m-0 mt-1 break-words text-xl font-bold">${s.name || "Script sin nombre"}</h2>
          <p className="m-0 text-xs text-faint">Editado ${fmtDate(s.updatedAt)}</p>

      </div>
      <div className="flex gap-1 overflow-x-auto border-b border-line">
        ${TABS.map(([id, label, icon]) => html`<button key=${id} type="button" onClick=${() => setTab(id)} aria-current=${tab === id ? "page" : undefined}
          className=${"-mb-px flex shrink-0 items-center gap-2 whitespace-nowrap border-b-2 px-3 py-2 text-sm font-bold transition " + (tab === id ? "border-acc text-ink" : "border-transparent text-mute hover:text-ink")}>
          <${Icon} name=${icon} size=${16} />${label}</button>`)}
      </div>
      ${tab === "compartir" && html`<${ShareTab} s=${s} gist=${gist} notify=${notify} openQR=${openQR} />`}
      ${tab === "codigo" && html`<${EditTab} s=${s} patch=${patch} notify=${notify} />`}
      ${tab === "auditoria" && html`<${AuditTab} s=${s} onApplyFix=${applyFix} notify=${notify} />`}
      <div className="flex justify-end border-t border-line pt-3"><${ConfirmBtn} small=${false} onConfirm=${onDelete} confirmText="Toca otra vez para borrar">Borrar script<//></div>

  // ---------- Ajustes (token, Gist, respaldo) ----------
  function Settings({ gist, setGist, scripts, replaceAll, notify, onClose }) {
    const [token, setToken] = useState(() => LS.get(TKEY, ""));
    const [gistId, setGistId] = useState(gist ? gist.id : "");
    const [showToken, setShowToken] = useState(false);
    const [busy, setBusy] = useState("");
    const fileRef = useRef(null);
    const saveToken = (v) => { setToken(v); LS.set(TKEY, v); };
    const run = async (kind) => {
      setBusy(kind);
      try {
        if (kind === "push") {
          const r = await G.pushGist(token, gist && gist.id ? gist : (gistId ? { id: gistId, files: {} } : null), scripts);
          replaceAll(r.scripts, r.meta); setGistId(r.meta.id); notify("Subido a la nube. " + G.live(r.scripts).length + " scripts en el Gist.");
        } else {
          const base = gist && gist.id ? gist : (gistId ? G.sanitizeGistMeta({ id: gistId, files: {} }) : null);
          const r = await G.pullGist(token, base, scripts);
          replaceAll(r.scripts, r.meta); setGistId(r.meta.id); notify("Descargado de la nube. Ahora tienes " + G.live(r.scripts).length + " scripts.");
        }
      } catch (e) { notify(e && e.message ? e.message : "Algo falló con GitHub."); }
      finally { setBusy(""); }
    };
    const doImport = (text) => { try { const p = G.parsePayload(text); replaceAll(G.mergeLibraries(scripts, p.scripts), gist); notify("Importado: " + G.live(p.scripts).length + " scripts del archivo."); } catch (e) { notify(e.message); } };
    return html`<div className="grid gap-5">
      <div className="flex items-center justify-between gap-2"><h2 className="m-0 flex items-center gap-2 text-xl font-bold"><${Icon} name="Settings" className="text-acc" />Ajustes<//>
        <${Btn} kind="subtle" small icon="X" label="Cerrar" onClick=${onClose} /></div>

      <section className="grid gap-3 rounded-2xl border border-line bg-panel p-4">
        <h3 className="m-0 flex items-center gap-2 font-bold"><${Icon} name="Github" size=${18} />Sincronizar con GitHub Gists</h3>
        <p className="m-0 text-sm text-mute">Guarda tu biblioteca en un Gist privado para tenerla en el celular y en el PC. Necesitas un <b>token clásico (classic)</b> con el permiso <b>gist</b>. Se guarda solo en este dispositivo.</p>
        <a href="https://github.com/settings/tokens/new?scopes=gist&description=Lanzador%20de%20Scripts" target="_blank" rel="noopener" className="text-sm text-info underline">Crear el token en GitHub (con el permiso «gist» ya marcado)</a>
        <${Field} id="f-token" label="Token de acceso personal (PAT)">
          <div className="flex gap-2">
            <input id="f-token" type=${showToken ? "text" : "password"} value=${token} onChange=${(e) => saveToken(e.target.value.trim())} className=${INPUT + " code min-w-0 flex-1"} placeholder="ghp_..." autoComplete="off" spellCheck="false" />
            <${Btn} small kind="ghost" icon=${showToken ? "EyeOff" : "Eye"} label="Mostrar u ocultar" onClick=${() => setShowToken(!showToken)} />
          </div>
        <//>
        <${Field} id="f-gistid" label="ID del Gist (opcional)" hint="Déjalo vacío para crear uno nuevo al subir. Pégalo para conectarte a uno que ya tienes.">
          <input id="f-gistid" type="text" value=${gistId} onChange=${(e) => setGistId(e.target.value.trim())} className=${INPUT + " code"} placeholder="Ej.: 1a2b3c..." />
        <//>
        ${IN_CLAUDE && html`<p className="m-0 flex gap-2 rounded-xl border border-info/40 bg-raised p-3 text-xs text-info"><${Icon} name="Info" size=${15} className="mt-0.5 shrink-0" />Dentro de claude.ai el visor bloquea la conexión con GitHub. Para subir y bajar del Gist, abre el archivo .html en Chrome en tu PC. La sincronización rápida celular↔PC dentro de claude.ai usa la nube de Claude (arriba a la derecha).</p>`}
        <div className="grid grid-cols-2 gap-2">
          <${Btn} kind="primary" icon="UploadCloud" disabled=${!!busy || !token} onClick=${() => run("push")}>${busy === "push" ? "Subiendo..." : "Subir a la nube (Push)"}<//>
          <${Btn} icon="DownloadCloud" disabled=${!!busy || !token} onClick=${() => run("pull")}>${busy === "pull" ? "Descargando..." : "Descargar (Pull)"}<//>
        </div>
        ${gist && gist.htmlUrl && html`<a href=${gist.htmlUrl} target="_blank" rel="noopener" className="text-sm text-info underline">Gist conectado: ${gist.owner}/${gist.id.slice(0, 8)}… (abrir en GitHub)</a>`}
      </section>

      <section className="grid gap-3 rounded-2xl border border-line bg-panel p-4">
        <h3 className="m-0 flex items-center gap-2 font-bold"><${Icon} name="HardDriveDownload" size=${18} />Respaldo en archivo (.json)</h3>
        <div className="grid grid-cols-2 gap-2">
          <${Btn} icon="FileJson" onClick=${async () => notify(await saveFile("lanzador-scripts-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(G.exportPayload(scripts, gist ? gist.files : {}), null, 1), "application/json"))}>Exportar todo<//>
          <${Btn} icon="Upload" onClick=${() => fileRef.current && fileRef.current.click()}>Importar<//>
          <input ref=${fileRef} type="file" accept=".json,application/json" className="hidden" onChange=${(e) => { const f = e.target.files && e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => doImport(String(rd.result || "")); rd.onerror = () => notify("No pude leer el archivo."); rd.readAsText(f); e.target.value = ""; }} />
        </div>
      </section>
    </div>`;
  }

  // ---------- Aplicación ----------
  function App() {
    const init = loadLocal();
    const [scripts, setScripts] = useState(init.scripts);
    const [gist, setGist] = useState(init.gist);
    const [query, setQuery] = useState("");
    const [filterCat, setFilterCat] = useState("");
    const [filterLang, setFilterLang] = useState("");
    const [selId, setSelId] = useState(() => { const l = G.live(init.scripts); return l.length ? l.sort((a, b) => b.updatedAt - a.updatedAt)[0].id : null; });
    const [tab, setTab] = useState("compartir");
    const [view, setView] = useState("list"); // en móvil: list | detail | settings
    const [toast, setToast] = useState(null);
    const [qr, setQr] = useState(null);
    const scriptsRef = useRef(scripts); scriptsRef.current = scripts;
    const gistRef = useRef(gist); gistRef.current = gist;
    const cloudWriteRef = useRef(null);

    const notify = useCallback((msg) => { if (msg) setToast({ msg: msg, id: Date.now() }); }, []);
    useEffect(() => { if (!toast) return undefined; const t = setTimeout(() => setToast(null), 3600); return () => clearTimeout(t); }, [toast]);

    // Guardado local (con aviso único si el navegador no deja guardar).
    const warned = useRef(false);
    useEffect(() => {
      const t = setTimeout(() => { if (!LS.set(LKEY, { scripts: scripts, gist: gist }) && !warned.current) { warned.current = true; notify("No pude guardar en este navegador: lo de esta sesión se perderá al cerrar."); } }, 250);
      return () => clearTimeout(t);
    }, [scripts, gist]);

    // Nube de Claude: funde los cambios que llegan de otro dispositivo.
    const onRemote = useCallback((remote) => {
      setScripts((cur) => G.mergeLibraries(cur, remote.scripts));
      if (remote.gist && (!gistRef.current || remote.gist.pushedAt > gistRef.current.pushedAt)) setGist(remote.gist);
    }, []);
    const [cloud, cloudWrite] = useClaudeCloud(onRemote);
    cloudWriteRef.current = cloudWrite;

    const persistScript = (s) => { if (cloudWriteRef.current) cloudWriteRef.current(s.id, s); };
    const persistMeta = (g) => { if (cloudWriteRef.current) cloudWriteRef.current("meta", { gist: g || null }); };

    const results = useMemo(() => G.search(scripts, query, { category: filterCat, lang: filterLang }), [scripts, query, filterCat, filterLang]);
    const selected = useMemo(() => G.live(scripts).find((s) => s.id === selId) || null, [scripts, selId]);

    const openScript = (id) => { setSelId(id); setTab("compartir"); setView("detail"); };
    const patch = (fields) => {
      if (!selected) return;
      const next = Object.assign({}, selected, fields, { updatedAt: Date.now() });
      setScripts((cur) => cur.map((s) => (s.id === next.id ? next : s)));
      persistScript(next);
    };
    const applyFix = (fixId) => { if (selected) patch({ code: G.applyFix(selected.code, fixId) }); };
    const addScript = () => {
      const s = G.newScript("pwsh");
      setScripts((cur) => cur.concat(s)); persistScript(s);
      setSelId(s.id); setTab("codigo"); setView("detail");
    };
    const deleteScript = () => {
      if (!selected) return;
      const tomb = Object.assign({}, selected, { deleted: true, updatedAt: Date.now() });
      setScripts((cur) => cur.map((s) => (s.id === tomb.id ? tomb : s)));
      persistScript(tomb);
      notify("Script borrado."); setView("list"); setSelId(null);
    };
    const replaceAll = (nextScripts, nextGist) => {
      const clean = G.mergeLibraries(nextScripts, []);
      setScripts(clean); setGist(nextGist || null);
      G.live(clean).forEach(persistScript);
      clean.filter((s) => s.deleted).forEach(persistScript);
      persistMeta(nextGist || null);
      const stillThere = G.live(clean).some((s) => s.id === selId);
      if (!stillThere) { const l = G.live(clean); setSelId(l.length ? l[0].id : null); }
    };
    const setGistBoth = (g) => { setGist(g); persistMeta(g); };

    const cloudBadge = { conectando: ["Nube: conectando…", "text-mute", "Loader"], sincronizado: ["Nube de Claude activa", "text-good", "CloudCheck"], local: ["Solo en este equipo", "text-faint", "HardDrive"], error: ["Nube: error", "text-bad", "CloudOff"] }[cloud.status] || ["", "text-faint", "HardDrive"];

    const List = html`<div className="grid gap-3">
      <div className="grid gap-2">
        <div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-faint"><${Icon} name="Search" size=${18} /></span>
          <input type="search" value=${query} onChange=${(e) => setQuery(e.target.value)} placeholder="Buscar por nombre, etiqueta o problema…" aria-label="Buscar scripts" className=${INPUT + " pl-10"} /></div>
        <div className="flex gap-2 overflow-x-auto pb-1">
          <button type="button" onClick=${() => setFilterCat("")} aria-pressed=${!filterCat} className=${"shrink-0 rounded-full border px-3 py-1.5 text-sm font-semibold " + (!filterCat ? "border-acc bg-acc text-acc-ink" : "border-line bg-raised text-ink")}>Todas</button>
          ${G.CATEGORIES.map((c) => html`<button key=${c} type="button" onClick=${() => setFilterCat(filterCat === c ? "" : c)} aria-pressed=${filterCat === c}
            className=${"shrink-0 inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-sm font-semibold " + (filterCat === c ? "border-acc bg-acc text-acc-ink" : "border-line bg-raised text-ink")}><${Icon} name=${CAT_ICON[c]} size=${15} />${c}</button>`)}
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <div className="flex gap-1 rounded-xl border border-line bg-raised p-1">
            <button type="button" onClick=${() => setFilterLang("")} className=${"rounded-lg px-2.5 py-1 text-sm font-semibold " + (!filterLang ? "bg-line text-ink" : "text-mute")}>Todos</button>
            ${Object.keys(G.LANGS).map((k) => html`<button key=${k} type="button" onClick=${() => setFilterLang(filterLang === k ? "" : k)} className=${"rounded-lg px-2.5 py-1 text-sm font-semibold " + (filterLang === k ? "bg-line text-ink" : "text-mute")}>${G.LANGS[k].short}</button>`)}
          </div>
          <span className="ml-auto text-sm text-faint">${results.length} de ${G.live(scripts).length}</span>
        </div>
      </div>
      ${results.length === 0 ? html`<p className="rounded-2xl border border-dashed border-line p-6 text-center text-mute">${G.live(scripts).length ? "Nada coincide con la búsqueda." : "No tienes scripts. Toca «Nuevo» para crear uno."}</p>`
        : html`<ul className="grid gap-2">${results.map((s) => html`<li key=${s.id}>
          <button type="button" onClick=${() => openScript(s.id)} className=${"grid w-full gap-1.5 rounded-2xl border bg-panel p-3 text-left transition hover:border-line " + (selId === s.id ? "border-acc" : "border-line/60")}>
            <div className="flex items-start justify-between gap-2"><span className="min-w-0 break-words font-semibold">${s.name || "Script sin nombre"}</span><${Chip} tone=${LANG_TONE[s.lang]}>${G.LANGS[s.lang].short}<//></div>
            ${s.notes && html`<p className="m-0 line-clamp-2 text-sm text-mute">${s.notes}</p>`}
            <div className="flex flex-wrap items-center gap-1.5"><span className="inline-flex items-center gap-1 text-xs text-faint"><${Icon} name=${CAT_ICON[s.category]} size=${13} />${s.category}</span>
              ${s.tags.slice(0, 3).map((t) => html`<${Chip} key=${t}>${t}<//>`)}${s.tags.length > 3 && html`<span className="text-xs text-faint">+${s.tags.length - 3}</span>`}</div>
          </button></li>`)}</ul>`}
    </div>`;

    return html`<div className="grid gap-4">
      <header className="grid gap-3">
        <div className="flex items-center justify-between gap-2">
          <h1 className="m-0 flex items-center gap-2 text-2xl font-extrabold tracking-tight"><${Icon} name="TerminalSquare" size=${26} className="text-acc" />Lanzador de Scripts</h1>
          <div className="flex items-center gap-2">
            <span className=${"hidden items-center gap-1.5 text-xs sm:inline-flex " + cloudBadge[1]} title=${cloud.detail}><${Icon} name=${cloudBadge[2]} size=${15} />${cloudBadge[0]}</span>
            <${Btn} small kind="ghost" icon="Settings" label="Ajustes" onClick=${() => setView("settings")} />
            <${Btn} small kind="primary" icon="Plus" onClick=${addScript}>Nuevo<//>
          </div>
        </div>
        ${cloud.detail && cloud.status !== "sincronizado" && html`<p className="m-0 flex gap-2 rounded-xl border border-line bg-panel p-2.5 text-xs text-mute"><${Icon} name="Info" size=${14} className="mt-0.5 shrink-0" />${cloud.detail}</p>`}
      </header>

      ${view === "settings"
        ? html`<${Settings} gist=${gist} setGist=${setGistBoth} scripts=${scripts} replaceAll=${replaceAll} notify=${notify} onClose=${() => setView("list")} />`
        : html`<div className="grid gap-4 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.4fr)]">
            <div className=${(view === "detail" ? "hidden " : "") + "lg:block"}>${List}</div>
            <div className=${(view === "list" ? "hidden " : "") + "lg:block"}>
              ${selected ? html`<div className="rounded-2xl border border-line bg-panel/40 p-4">
                  <${Detail} s=${selected} gist=${gist} tab=${tab} setTab=${setTab} patch=${patch} applyFix=${applyFix} notify=${notify} openQR=${(t, x) => setQr({ title: t, text: x })} onClose=${() => setView("list")} onDelete=${deleteScript} />
                </div>`
                : html`<div className="hidden h-full place-items-center rounded-2xl border border-dashed border-line p-10 text-center text-mute lg:grid">Elige un script de la lista o crea uno nuevo.</div>`}
            </div>
          </div>`}

      <footer className="text-xs text-faint">Esta app guarda, audita y comparte scripts; <b>no los ejecuta</b>. Revisa siempre el código antes de correrlo en un equipo. Todo se guarda en tu dispositivo y, si inicias sesión, en tu cuenta.</footer>
      ${qr && html`<${QrModal} title=${qr.title} text=${qr.text} notify=${notify} onClose=${() => setQr(null)} />`}
      ${toast && html`<div role="status" key=${toast.id} className="fixed left-1/2 z-50 w-[min(92vw,520px)] -translate-x-1/2 rounded-xl border border-line bg-raised px-4 py-3 text-sm shadow-2xl" style=${{ bottom: "calc(16px + env(safe-area-inset-bottom, 0px))" }}>${toast.msg}</div>`}
    </div>`;
  }

  class Boundary extends React.Component {
    constructor(props) { super(props); this.state = { error: null }; }
    static getDerivedStateFromError(error) { return { error: error }; }
    render() {
      if (!this.state.error) return this.props.children;
      return html`<div className="grid gap-3 rounded-2xl border border-bad/60 bg-panel p-5">
        <h2 className="m-0 text-lg font-bold">Algo falló al mostrar la app</h2>
        <p className="m-0 text-sm text-mute">Detalle: ${String(this.state.error && this.state.error.message || this.state.error)}</p>
        <button type="button" className="min-h-[48px] rounded-xl border border-line bg-raised px-4 font-semibold" onClick=${() => location.reload()}>Recargar</button>
      </div>`;
    }
  }
  ReactDOM.createRoot(rootEl).render(html`<${Boundary}><${App} /><//>`);
};
</script>

<script id="loader">
/*
 * Cargador con respaldo: cada librería se intenta en varios servidores permitidos.
 * Los íconos y el generador de QR son opcionales: sin ellos la app sigue funcionando.
 */
(function () {
  "use strict";
  var rootEl = document.getElementById("root");
  var LIBS = [
    { name: "React", test: function () { return window.React; }, urls: [
      "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
      "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js",
      "https://unpkg.com/react@18.3.1/umd/react.production.min.js"] },
    { name: "ReactDOM", test: function () { return window.ReactDOM; }, urls: [
      "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
      "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js",
      "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"] },
    { name: "htm", test: function () { return window.htm; }, urls: [
      "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js",
      "https://unpkg.com/htm@3.1.1/dist/htm.umd.js"] },
    { name: "íconos (lucide-react)", optional: true, test: function () { return window.LucideReact; },
      before: function () { window.react = window.React; },
      urls: [
        "https://cdn.jsdelivr.net/npm/lucide-react@0.263.1/dist/umd/lucide-react.min.js",
        "https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"] },
    { name: "generador de QR", optional: true, test: function () { return window.qrcode; }, urls: [
      "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js",
      "https://unpkg.com/qrcode-generator@1.4.4/qrcode.js",
      "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"] },
  ];
  var tried = [];
  function loadScript(url, ms) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      var timer = setTimeout(function () { s.onload = s.onerror = null; reject(new Error("tardó demasiado")); }, ms);
      s.src = url;
      s.onload = function () { clearTimeout(timer); resolve(); };
      s.onerror = function () { clearTimeout(timer); reject(new Error("bloqueado o sin conexión")); };
      document.head.appendChild(s);
    });
  }
  function loadLib(lib) {
    if (lib.before) lib.before();
    if (lib.test()) return Promise.resolve(true);
    var i = 0;
    function next() {
      if (i >= lib.urls.length) return Promise.resolve(false);
      var url = lib.urls[i++];
      return loadScript(url, 10000).then(function () {
        if (lib.test()) return true;
        tried.push(lib.name + ": " + url.split("/")[2] + " cargó pero no definió la librería");
        return next();
      }, function (e) { tried.push(lib.name + ": " + url.split("/")[2] + " " + e.message); return next(); });
    }
    return next();
  }
  function showFailure(missing) {
    rootEl.textContent = "";
    var box = document.createElement("div"); box.className = "boot";
    var h = document.createElement("p"); h.style.color = "#e2ebe6"; h.textContent = "No pude cargar: " + missing.join(", ") + ".";
    var why = document.createElement("p"); why.textContent = "Revisa tu conexión y vuelve a intentar. Si sigue igual, envía este detalle:";
    var pre = document.createElement("pre"); pre.style.whiteSpace = "pre-wrap"; pre.style.fontSize = "12px";
    pre.textContent = tried.concat(window.__bootErrors || []).join("\n") || "(sin detalle)";
    var btn = document.createElement("button"); btn.type = "button"; btn.textContent = "Reintentar";
    btn.style.cssText = "min-height:48px;padding:0 16px;border-radius:12px;border:1px solid #3ddc84;background:#3ddc84;color:#06240f;font-weight:700";
    btn.addEventListener("click", function () { location.reload(); });
    box.appendChild(h); box.appendChild(why); box.appendChild(pre); box.appendChild(btn); rootEl.appendChild(box);
  }
  if (!window.GestorEngine) { showFailure(["el motor de la app"]); return; }
  var missing = [];
  LIBS.reduce(function (chain, lib) {
    return chain.then(function () { return loadLib(lib).then(function (ok) { if (!ok && !lib.optional) missing.push(lib.name); }); });
  }, Promise.resolve()).then(function () {
    if (missing.length) { showFailure(missing); return; }
    try { window.__startApp(); } catch (e) { tried.push("interfaz: " + e.message); showFailure(["la interfaz"]); }
  });
})();
</script>
