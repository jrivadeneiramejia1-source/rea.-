/* Diseño: un solo tema oscuro (pedido explícito). Columna central; la comparación Original/Mejorado se divide en dos desde 768 px. */
:root {
  color-scheme: dark;
  --base: #0b1117; --panel: #111a22; --raised: #17232d; --line: #24343f;
  --ink: #e4ebef; --mute: #93a4af; --faint: #61727d;
  --acc: #f2a541; --acc-ink: #1b1205; --good: #4cc184; --warn: #f0b44c; --bad: #f07a62; --info: #6aa6ec;

html, body { margin: 0; background: var(--base); color: var(--ink); }
body {
  font: 15px/1.55 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#root { max-width: 64rem; margin: 0 auto; padding-block: 16px 48px; }
.boot { color: var(--mute); padding: 32px 0; }
textarea { resize: vertical; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
::selection { background: rgba(242, 165, 65, .35); }
.wave { display: inline-flex; align-items: center; gap: 3px; height: 22px; }
.wave i { display: block; width: 3px; height: 6px; border-radius: 2px; background: currentColor; }
.wave.on i { animation: wave 1s ease-in-out infinite; }
.wave.on.loud i { animation-duration: .55s; }
.wave i:nth-child(2) { animation-delay: .12s; } .wave i:nth-child(3) { animation-delay: .24s; }
.wave i:nth-child(4) { animation-delay: .36s; } .wave i:nth-child(5) { animation-delay: .48s; }
@keyframes wave { 0%, 100% { height: 5px; } 50% { height: 20px; } }
.pulse { position: relative; }
.pulse::after { content: ""; position: absolute; inset: -4px; border-radius: 9999px; border: 2px solid var(--bad); animation: ring 1.4s ease-out infinite; pointer-events: none; }
@keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .wave.on i, .pulse::after { animation: none; } .wave.on i { height: 14px; } }
pre.prompt { white-space: pre-wrap; overflow-wrap: anywhere; }

<script id="engine">
/*
 * ===================== MOTOR DEL ASESOR (sin interfaz) =====================
 * Inspirado en:
 *  - DSPy: "firma" idea → prompt, demostraciones (few-shot) tomadas de tus favoritos
 *    y elección de configuración según lo que mejor te ha funcionado.
 *  - Promptfoo: rúbrica de aserciones con peso; cada una pasa, falla o no aplica.
 *  - LangChain: plantillas de prompt y selector de ejemplos por similitud.
 *  - Anthropic: rol, etiquetas XML, datos separados de instrucciones, ejemplos y
 *    razonamiento paso a paso con <thinking>/<answer>.
 * Todo es local y determinista: no llama a ninguna IA ni gasta tokens.
 */
(function (root) {
  "use strict";

  // ---------- 1. Texto ----------
  const fold = (s) => String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const padded = (s) => " " + fold(s).replace(/\s+/g, " ") + " ";
  const wordsOnly = (s) => " " + fold(s).replace(/[^a-z0-9]+/g, " ").trim() + " ";
  const countWords = (s) => (String(s || "").trim().match(/\S+/g) || []).length;
  const clip = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
  const uniq = (a) => Array.from(new Set(a.filter(Boolean)));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // Español ≈ 1 token cada 3,3 caracteres; código ≈ 1 cada 2,8. Margen ±30 %.
  function estimateTokens(text) {
    const s = String(text || "");
    if (!s.trim()) return 0;
    const codeChars = (s.match(/[{}()\[\];=<>$|\\/`]/g) || []).length;
    return Math.max(1, Math.round(s.length / (codeChars / s.length > 0.04 ? 2.8 : 3.3)));
  }

  const STOP = new Set(("para como cuando donde quiero necesito hazme crea dame este esta esto estos estas unos unas sobre entre desde hasta " +
    "tengo tiene tienen puede pueda porque pero tambien solo cada todo todos toda todas mucho muchos mucha muy algo cosas favor gracias hola bueno pues " +
    "seria hacer haga hacerlo ayuda ayudame quisiera podrias puedes forma manera tipo bien mejor otra otro otros nada").split(" "));
  function keywords(text) {
    return uniq(wordsOnly(text).trim().split(" ").filter((w) => w.length >= 4 && !STOP.has(w))).slice(0, 40);
  }
  function similarity(a, b) {
    const A = new Set(a || []), B = new Set(b || []);
    if (!A.size || !B.size) return 0;
    let inter = 0;
    A.forEach((x) => { if (B.has(x)) inter++; });
    return inter / (A.size + B.size - inter);
  }

  // Muletillas típicas al dictar por voz.
  const FILLERS = [
    /[¿]?\bverdad\?/gi, /,?\s*\bo sea\b,?/gi, /,?\s*\byo que s[eé](?![a-z]),?/gi, /[¿]?\bno\?(?=\s|$)/gi,
    /\bbueno,\s*/gi, /\bpues,\s*/gi, /\bmira,\s*/gi, /\beste,\s*/gi, /\bpor favor,?\s*/gi,
    /\bme podr[ií]as ayudar a\s*/gi, /\bquisiera saber si\s*/gi, /\bcomo que\s+(?=como)/gi,
  ];
  function cleanText(text) {
    let s = String(text || "");
    const before = s.length;
    for (const re of FILLERS) s = s.replace(re, " ");
    s = s.replace(/\b(\w+)(\s+\1\b)+/gi, "$1")
      .replace(/[ \t]{2,}/g, " ").replace(/\s+([,.;:?!])/g, "$1").replace(/^\s*,\s*/gm, "").replace(/[,;]\s*$/, "").trim();
    s = s.charAt(0).toUpperCase() + s.slice(1);
    return { text: s, removed: Math.max(0, before - s.length) };
  }

  // Separa datos (bloques de código, líneas de error) de la instrucción, como recomienda Anthropic.
  function splitInput(text) {
    const blocks = [];
    let rest = String(text || "").replace(/```[\s\S]*?```/g, (m) => { blocks.push(m.trim()); return " "; });
    rest = rest.split("\n").filter((line) => {
      if (/^\s*(error|exception|traceback|warning|fatal|uncaught|at [\w.$<>]+\s*\(|file ")/i.test(line) && line.trim().length > 12) {
        blocks.push(line.trim());
        return false;
      }
      return true;
    }).join("\n");
    return { rest: rest.replace(/[ \t]{2,}/g, " ").trim(), blocks };
  }

  // ---------- 2. Complejidad ----------
  const KW = {

  function classify(text) {
    const t = wordsOnly(text);
    const words = countWords(text);
    const hit = (list) => list.filter((k) => t.includes(k));
    const why = [];
    let score = 0;
    const d = hit(KW.dificil), m = hit(KW.medio), s = hit(KW.simple), r = hit(KW.reintento);
    if (d.length) { score += 3 + (d.length - 1) * 1.5; why.push("Señales de tarea grande: " + d.map((x) => x.trim()).slice(0, 4).join(", ")); }
    if (m.length) { score += Math.min(3, 1.5 + (m.length - 1) * 0.5); why.push("Señales técnicas: " + m.map((x) => x.trim()).slice(0, 4).join(", ")); }
    if (s.length && !d.length && !m.length) { score -= 1; why.push("Tarea de texto corta: " + s.map((x) => x.trim()).slice(0, 3).join(", ")); }
    if (r.length) { score += 1.5; why.push("Ya hubo intentos fallidos: sube un nivel."); }
    const reqs = String(text || "").split("\n").filter((l) => /^\s*([-*•]|\d+[.)])\s+/.test(l)).length;
    if (reqs >= 5) { score += 1; why.push(reqs + " requisitos en lista."); }
    if (words > 400) { score += 2; why.push("Pedido muy largo (" + words + " palabras)."); }
    else if (words > 150) { score += 1; why.push("Pedido largo (" + words + " palabras)."); }
    if (/```|\bfunction\b|\bdef \b|\$\w+\s*=|<\/?\w+>/.test(String(text || ""))) { score += 0.5; why.push("Incluye código."); }
    const level = score >= 7.5 ? 4 : score >= 4.5 ? 3 : score >= 1.5 ? 2 : 1;
    if (!why.length) why.push("Sin señales técnicas: se trata como tarea simple.");
    return { level, score: Math.round(score * 10) / 10, why };
  }

  function typesOf(text) {
    const W = wordsOnly(text);
    // El verbo con el que empieza el pedido manda: «Compara hostings para mi web» es un análisis, no una página.
    const head = W.slice(0, 48);
    const scored = TYPES.map((t) => ({
      t, n: t.match.filter((k) => W.includes(" " + k)).length,
    })).filter((x) => x.n > 0);
    // Un reporte de falla casi siempre es depuración, aunque nombre la tecnología.
    scored.forEach((x) => { x.n += (x.t.priority || 0) + (x.t.intent && x.t.match.some((k) => head.includes(" " + k)) ? 2 : 0); });
    return scored.sort((a, b) => b.n - a.n || TYPES.indexOf(a.t) - TYPES.indexOf(b.t)).map((x) => x.t);
  }

  function detect(text) {

      action: RX.action.test(P), purpose: RX.purpose.test(P), audience: RX.audience.test(P),
      environment: RX.environment.test(P), input: RX.input.test(fold(raw)) || split.blocks.length > 0,

      tone: RX.tone.test(P), role: RX.role.test(P), vague: RX.vague.test(wordsOnly(raw)),
      multi: (P.match(RX.actionG) || []).length >= 4,
    };
    return {
      raw, P, empty: !raw.trim(), clean: cleaned.text, removedChars: cleaned.removed, input: split.blocks,
      words: countWords(raw), types, primary: types[0] || GENERAL, level: c.level, levelInfo: LEVELS[c.level],
      why: c.why, has, keywords: keywords(raw),
    };
  }

    { id: "format", dim: "restricciones", w: 10, label: "Formato de salida", fix: "Di cómo quieres la respuesta: código completo, pasos, tabla, máximo N líneas." },
    { id: "constraints", dim: "restricciones", w: 8, label: "Límites (qué no hacer)", fix: "Di qué NO debe hacer: «sin librerías externas», «no cambies los nombres»." },
    { id: "success", dim: "restricciones", w: 8, label: "Criterio de éxito", fix: "Di cómo sabrás que quedó bien: «debe crear el CSV con 3 columnas»." },
    { id: "tone", dim: "restricciones", w: 6, label: "Tono y estilo", fix: "Indica el tono o estilo: formal, técnico, directo, en español." },
  ];
  const DIMS = [
    { id: "claridad", name: "Claridad" },
    { id: "contexto", name: "Contexto" },
    { id: "restricciones", name: "Restricciones" },
  ];

  function applicability(det) {
    const ids = det.types.map((t) => t.id);
    const any = (list) => ids.some((x) => list.includes(x));
    return {
      action: true, specific: true, unambiguous: true, role: true, format: true, tone: true, constraints: true,
      purpose: det.level >= 2,
      single: det.level >= 2,
      success: det.level >= 2,
      audience: det.level >= 2 || any(["writing"]),
      environment: any(TECH),
      input: det.level >= 3 || (det.level >= 2 && any(["debug", "data", "prompt", "writing", "script"])),
    };
  }

  function evaluate(features, appl) {
    const checks = CHECKS.map((c) => ({ id: c.id, dim: c.dim, w: c.w, label: c.label, fix: c.fix, applicable: !!appl[c.id], pass: !!features[c.id] }));
    const sum = (list) => list.reduce((a, c) => a + c.w, 0);
    const app = checks.filter((c) => c.applicable);
    const score = app.length ? Math.round((100 * sum(app.filter((c) => c.pass))) / sum(app)) : 0;
    const dims = {};
    DIMS.forEach((d) => {
      const list = app.filter((c) => c.dim === d.id);
      dims[d.id] = { name: d.name, score: list.length ? Math.round((100 * sum(list.filter((c) => c.pass))) / sum(list)) : 100, passed: list.filter((c) => c.pass).length, total: list.length };
    });
    return { score, dims, checks, missing: app.filter((c) => !c.pass) };
  }

  function featuresFromText(det) {
    const h = det.has;
    return {
      action: h.action, specific: countWords(det.clean) >= (det.level === 1 ? 3 : 8), purpose: h.purpose, single: !h.multi, unambiguous: !h.vague,
      role: h.role, environment: h.environment, audience: h.audience, input: h.input,
      format: h.format, constraints: h.constraints, success: h.success, tone: h.tone,
    };
  }
  function featuresFromSpec(spec, det) {
    const h = det.has;
    return {
      action: h.action || spec.instructions.length > 0,
      specific: countWords(det.clean) + spec.answerWords >= (det.level === 1 ? 3 : 8),
      purpose: h.purpose || !!spec.objective,
      single: !h.multi,
      unambiguous: !h.vague,
      role: true,
      environment: h.environment || spec.envKnown,
      audience: h.audience || !!spec.audience,
      input: h.input || spec.input.length > 0 || spec.examples.length > 0,
      format: true,
      constraints: h.constraints || spec.constraints.length > 0,
      success: h.success || !!spec.success,
      tone: h.tone || !!spec.tone || spec.style.length > 0,
    };
  }

  // ---------- 6. Modo Entrevista ----------
  function interview(det, ctx) {
    const facts = ctx.facts || {};
    const profile = ctx.profile || {};
    const appl = applicability(det);
    const out = [], remembered = [];
    if (det.empty) return { questions: out, remembered };
    // Pocas preguntas en tareas simples: preguntar también cuesta tiempo.
    const max = det.level >= 3 ? 3 : det.level === 2 ? 2 : det.primary.id === "writing" ? 1 : 0;
    const typeQs = [];
    for (let i = 0; i < 3; i++) det.types.forEach((t) => { if (t.qs[i]) typeQs.push(t.qs[i]); });
    const genericSlots = SLOT_ORDER.filter((slot) => {
      if (slot === "format") return det.primary === GENERAL && !det.has.format;
      if (slot === "constraints") return det.level >= 3 && !det.has.constraints;
      if (slot === "tone") return det.primary.id === "writing" && !det.has.tone;
      if (slot === "environment") return appl.environment && !det.has.environment && !profile.sistema;
      if (slot === "audience") return appl.audience && !det.has.audience && !profile.rol;
      return appl[slot] && !det.has[slot];
    }).map((s) => SLOT_QS[s]);
    const askedSlots = new Set();
    for (const q of typeQs.concat(genericSlots)) {
      const generic = q.id.indexOf("g_") === 0;
      if (q.skip && q.skip.test(det.P)) continue;
      if (["purpose", "audience", "tone", "format"].includes(q.slot) && det.has[q.slot]) continue;
      if (generic && askedSlots.has(q.slot)) continue;
      if (q.fact && facts[q.fact]) { remembered.push({ label: q.fact, value: facts[q.fact], slot: q.slot }); askedSlots.add(q.slot); continue; }
      if (out.some((x) => x.id === q.id)) continue;
      out.push(q);
      askedSlots.add(q.slot);
    }
    return { questions: out.slice(0, max), remembered };
  }

  // ---------- 7. Preferencias, perfil y memoria ----------
  const STYLE_CHIPS = [
    { id: "espanol", label: "En español", text: "Responde en español.", kind: "style" },
    { id: "directo", label: "Respuestas directas", text: "Ve directo a la respuesta, sin introducciones ni resumen final.", kind: "constraint" },
    { id: "porque", label: "El porqué en 1 a 3 frases", text: "Explica el porqué en 1 a 3 frases, no más.", kind: "style" },
    { id: "codigo", label: "Código probado", text: "Entrega código completo y revisado contra errores comunes; si algo queda sin probar, dilo en una línea.", kind: "constraint", code: true },
    { id: "rutas", label: "Comandos con rutas reales", text: "Da comandos listos para copiar, con rutas reales.", kind: "format", code: true },
    { id: "fragmento", label: "Cambio pequeño: solo el fragmento", text: "Si el cambio es pequeño, muestra solo el fragmento y dónde va.", kind: "format", code: true },
    { id: "pasos", label: "Pasos numerados", text: "Usa pasos numerados cuando haya un procedimiento.", kind: "format" },
    { id: "ejemplo", label: "Con un ejemplo", text: "Incluye un ejemplo práctico.", kind: "style" },
  ];
  const FRAMEWORKS = {
    xml: { id: "xml", name: "Etiquetas XML (Anthropic)", short: "XML" },
    costar: { id: "costar", name: "CO-STAR", short: "CO-STAR" },
    compact: { id: "compact", name: "Compacto", short: "Compacto" },
  };
  const NIVEL_TXT = { basico: "básico", intermedio: "intermedio", avanzado: "avanzado" };
  const EMPTY_PROFILE = { nombre: "", rol: "", nivel: "intermedio", sistema: "", herramientas: "", rutas: "", metas: "", noQuiero: "", enApp: false };
  const DEFAULT_PREFS = {
    provider: "claude", framework: "auto", cot: "auto", useExamples: true, chips: ["espanol", "directo"], styleText: "",
    voiceLang: "es-CO", voiceRate: 1, autoAdvance: true, autoRead: true,
  };
  const emptyStats = () => ({ n: 0, levels: [0, 0, 0, 0, 0], missing: {}, topics: {}, words: 0, frameworks: {}, likes: 0 });
  const hasProfile = (p) => !!(p && (p.rol || p.sistema || p.herramientas || p.metas || p.nombre));

  const str = (v, n) => (typeof v === "string" ? v.slice(0, n) : "");
  function sanitizeProfile(p) {
    const out = Object.assign({}, EMPTY_PROFILE);
    if (p && typeof p === "object") Object.keys(EMPTY_PROFILE).forEach((k) => {
      if (k === "enApp") out.enApp = p.enApp === true; else out[k] = str(p[k], 600);
    });
    if (!NIVEL_TXT[out.nivel]) out.nivel = "intermedio";
    return out;
  }
  function sanitizePrefs(p) {
    const out = Object.assign({}, DEFAULT_PREFS, { chips: DEFAULT_PREFS.chips.slice() });
    if (!p || typeof p !== "object") return out;
    if (PROVIDERS[p.provider]) out.provider = p.provider;
    if (p.framework === "auto" || FRAMEWORKS[p.framework]) out.framework = p.framework;
    if (["auto", "on", "off"].includes(p.cot)) out.cot = p.cot;
    if (typeof p.useExamples === "boolean") out.useExamples = p.useExamples;
    if (Array.isArray(p.chips)) out.chips = p.chips.filter((c) => STYLE_CHIPS.some((x) => x.id === c));
    out.styleText = str(p.styleText, 600);
    if (/^es-[A-Z]{2}$/.test(p.voiceLang)) out.voiceLang = p.voiceLang;
    if (typeof p.voiceRate === "number" && p.voiceRate >= 0.6 && p.voiceRate <= 1.6) out.voiceRate = p.voiceRate;
    if (typeof p.autoAdvance === "boolean") out.autoAdvance = p.autoAdvance;
    if (typeof p.autoRead === "boolean") out.autoRead = p.autoRead;
    return out;
  }
  function sanitizeStats(s) {
    const out = emptyStats();
    if (!s || typeof s !== "object") return out;
    out.n = Math.max(0, Number(s.n) || 0);
    if (Array.isArray(s.levels) && s.levels.length === 5) out.levels = s.levels.map((x) => Math.max(0, Number(x) || 0));
    ["missing", "topics", "frameworks"].forEach((k) => {
      if (s[k] && typeof s[k] === "object") Object.keys(s[k]).forEach((a) => { out[k][a.slice(0, 40)] = Math.max(0, Number(s[k][a]) || 0); });
    });
    out.words = Math.max(0, Number(s.words) || 0);
    out.likes = Math.max(0, Number(s.likes) || 0);
    return out;
  }
  function sanitizeFacts(f) {
    const out = {};
    if (f && typeof f === "object") Object.keys(f).slice(0, 60).forEach((k) => { const v = str(f[k], 300).trim(); if (v) out[k.slice(0, 80)] = v; });
    return out;
  }
  const isObj = (x) => x && typeof x === "object";
  function sanitizeEntry(e, withAnswer) {
    if (!isObj(e) || typeof e.idea !== "string" || typeof e.prompt !== "string") return null;
    const out = {
      id: str(e.id, 40) || newId(), ts: Number(e.ts) || Date.now(), idea: str(e.idea, 6000), prompt: str(e.prompt, 20000),
      type: str(e.type, 20) || "general", framework: FRAMEWORKS[e.framework] ? e.framework : "xml", cot: !!e.cot,
      provider: PROVIDERS[e.provider] ? e.provider : "claude", score: Math.max(0, Math.min(100, Number(e.score) || 0)),
      level: Math.max(1, Math.min(4, Number(e.level) || 1)),
      answers: isObj(e.answers) ? sanitizeFacts(e.answers) : {},
    };
    out.keywords = Array.isArray(e.keywords) ? e.keywords.filter((k) => typeof k === "string").slice(0, 40) : keywords(out.idea);
    if (withAnswer) { out.answer = str(e.answer, 4000); out.note = str(e.note, 300); }
    return out;
  }
  function sanitizeTemplate(t) {
    if (!isObj(t) || typeof t.name !== "string" || typeof t.text !== "string") return null;
    return { id: str(t.id, 40) || newId(), name: str(t.name, 80).trim() || "Plantilla", text: str(t.text, 6000), ts: Number(t.ts) || Date.now() };
  }
  const listOf = (a, fn, max) => (Array.isArray(a) ? a.map(fn).filter(Boolean).slice(0, max) : []);

  function sanitizeMemory(m) {
    const src = isObj(m) ? m : {};
    return {
      v: 3,
      prefs: sanitizePrefs(src.prefs),
      profile: sanitizeProfile(src.profile),
      facts: sanitizeFacts(src.facts),
      stats: sanitizeStats(src.stats),
      history: listOf(src.history, (e) => sanitizeEntry(e, false), 50),
      favorites: listOf(src.favorites, (e) => sanitizeEntry(e, true), 100),
      templates: listOf(src.templates, sanitizeTemplate, 50),
    };
  }

  // Migra los datos de la versión anterior (perfil y aprendizaje).
  function migrateLegacy(legacy) {
    const l = legacy || {};
    const mem = sanitizeMemory(null);
    if (isObj(l.profile)) {
      mem.profile = sanitizeProfile(l.profile);
      if (typeof l.profile.estilo === "string") mem.prefs.styleText = l.profile.estilo.slice(0, 600);
    }
    if (isObj(l.learned)) {
      mem.facts = sanitizeFacts(l.learned.facts);
      mem.stats = sanitizeStats(l.learned);
    }
    if (PROVIDERS[l.app]) mem.prefs.provider = l.app;
    return mem;
  }

  function personalText(profile, prefs) {
    const p = sanitizeProfile(profile);
    const l = [];
    if (p.nombre || p.rol) l.push("Soy " + [p.nombre, p.rol].filter(Boolean).join(", ") + ".");
    l.push("Nivel técnico: " + NIVEL_TXT[p.nivel] + ".");
    if (p.sistema) l.push("Mi equipo: " + p.sistema + ".");
    if (p.herramientas) l.push("Herramientas que uso: " + p.herramientas + ".");
    if (p.rutas) l.push("Rutas habituales: " + p.rutas + ".");
    if (p.metas) l.push("Mis metas: " + p.metas + ".");
    const chips = STYLE_CHIPS.filter((c) => (prefs.chips || []).includes(c.id)).map((c) => c.text);
    if (chips.length || prefs.styleText) l.push("Cómo quiero las respuestas: " + chips.concat(prefs.styleText ? [prefs.styleText] : []).join(" "));
    if (p.noQuiero) l.push("No hagas: " + p.noQuiero + ".");
    return l.join("\n").replace(/\.\./g, ".");
  }
  const WHERE_TO_PASTE = {
    claude: "Claude: Configuración → Perfil → preferencias o «Instrucciones para Claude» (Settings → Profile). En Proyectos (Projects) también puedes ponerlas por proyecto.",
    chatgpt: "ChatGPT: tu perfil → Configuración → Personalización → Instrucciones personalizadas (Custom instructions). Límite: 1.500 caracteres en Free y Go.",
    gemini: "Gemini: Configuración y ayuda → Inteligencia personal → Información guardada (Saved info), o crea una Gem con este texto.",
    deepseek: "DeepSeek: no encontré una opción de instrucciones fijas. Pega el texto al inicio de cada chat nuevo.",
  };

  // ---------- 8. Modelos por app (menús de octubre de 2026) ----------
  const PROVIDERS = {
    claude: { label: "Claude", note: "Por precio de API, Opus 5.5 cuesta 2 veces Sonnet 5.5 y 40 veces Haiku 5.5 por token. Anthropic no publica cuánto descuenta cada modelo de tu plan.",
      levels: [null,
        { model: "Haiku 5.5", mode: "Pensamiento extendido (Extended thinking) apagado", price: 0.5 },
        { model: "Sonnet 5.5", mode: "Pensamiento extendido apagado", price: 10 },
        { model: "Sonnet 5.5", mode: "Pensamiento extendido encendido · en Claude Code: esfuerzo (effort) alto", price: 10 },
        { model: "Opus 5.5", mode: "Pensamiento extendido encendido · solo si Sonnet ya no pudo", price: 20 }] },
    chatgpt: { label: "ChatGPT", note: "Los niveles de pensamiento más altos tienen cupos menores en Free, Go y Plus.",
      levels: [null,
        { model: "GPT-6 Instant", mode: "Sin pensamiento" },
        { model: "GPT-6 Instant", mode: "Si la respuesta queda floja, pasa a Medio" },
        { model: "GPT-6 Thinking", mode: "Nivel Alto (High)" },
        { model: "GPT-6 Thinking", mode: "Extra alto (Extra High) · solo si Alto falló" }] },
    gemini: { label: "Gemini", note: "Pro y Deep Think tienen cupos diarios más bajos que Flash.",
      levels: [null,
        { model: "Flash-Lite o Flash", mode: "Pensamiento Bajo (Low)" },
        { model: "Flash", mode: "Pensamiento Medio (Medium)" },
        { model: "Pro", mode: "Pensamiento Medio (Medium)" },
        { model: "Pro", mode: "Pensamiento Alto (High) · Deep Think solo para investigación o matemática" }] },
    deepseek: { label: "DeepSeek", note: "DeepSeek no muestra límites fijos; el modo experto es más lento.",
      levels: [null,
        { model: "Modo rápido (Instant)", mode: "Sin razonamiento" },
        { model: "Modo rápido (Instant)", mode: "Activa el razonamiento solo si falla" },
        { model: "Modo experto (Expert / DeepThink)", mode: "Razonamiento activado" },
        { model: "Modo experto (Expert / DeepThink)", mode: "Divide la tarea en partes" }] },
  };
  const OUT = [0, 400, 1500, 4000, 8000];
  const THINK = [0, 0, 0, 3000, 8000];

  // ---------- 9. Elección de marco, CoT y ejemplos (estilo DSPy) ----------
  function chooseFramework(pref, det, provider, favorites) {
    if (pref && pref !== "auto" && FRAMEWORKS[pref]) return { id: pref, reason: "Lo elegiste en tus preferencias." };
    const counts = {};
    favorites.filter((f) => f.type === det.primary.id).forEach((f) => { counts[f.framework] = (counts[f.framework] || 0) + 1; });
    const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    if (top && counts[top] >= 2) return { id: top, reason: "Es el formato que más te ha gustado para «" + det.primary.name + "» (" + counts[top] + " favoritos)." };
    if (det.level === 1) return { id: "compact", reason: "Tarea simple: el formato corto gasta menos tokens." };
    if (provider === "claude") return { id: "xml", reason: "Claude sigue mejor las etiquetas XML (guía oficial de Anthropic)." };
    return { id: "costar", reason: "CO-STAR ordena contexto, objetivo, estilo, tono, audiencia y respuesta; funciona bien en " + PROVIDERS[provider].label + "." };
  }
  function chooseCot(pref, det) {
    if (pref === "on") return { on: true, reason: "Activado en tus preferencias." };
    if (pref === "off") return { on: false, reason: "Desactivado en tus preferencias." };
    if (det.level >= 3) return { on: true, reason: "Tarea compleja: razonar por pasos reduce errores." };
    if (det.level === 2 && det.primary.cot) return { on: true, reason: "En «" + det.primary.name + "» conviene razonar antes de responder." };
    return { on: false, reason: "No hace falta: gastaría tokens de salida sin mejorar la respuesta." };
  }
  // Selector de ejemplos por similitud (como el ExampleSelector de LangChain).
  function selectExamples(det, favorites, enabled) {
    if (!enabled || det.empty) return [];
    return favorites
      .filter((f) => f.answer && f.answer.trim())
      .map((f) => ({ f, s: similarity(det.keywords, f.keywords) + (f.type === det.primary.id ? 0.15 : 0) }))
      .filter((x) => x.s >= 0.2)
      .sort((a, b) => b.s - a.s)
      .slice(0, 2)
      .map((x) => ({ id: x.f.id, request: clip(x.f.idea, 400), response: clip(x.f.answer, 1500), similarity: Math.round(x.s * 100) }));
  }

  // ---------- 10. Especificación del prompt ----------
  function buildSpec(det, iv, ctx, choice) {
    const profile = ctx.profile, prefs = ctx.prefs, answersMap = ctx.answers || {};
    const t = det.primary;
    const useProfile = hasProfile(profile) && !profile.enApp && det.level >= 2;
    const usePrefs = !profile.enApp;
    const answered = iv.questions.filter((q) => (answersMap[q.id] || "").trim()).map((q) => Object.assign({}, q, { a: answersMap[q.id].trim() }));
    const slot = (s) => answered.filter((q) => q.slot === s);
    const isCode = det.types.some((x) => CODE.includes(x.id));
    const chips = usePrefs ? STYLE_CHIPS.filter((c) => prefs.chips.includes(c.id) && (!c.code || isCode)) : [];

    const context = [];
    if (useProfile) {
      context.push("Sobre mí: " + [profile.rol, "nivel técnico " + NIVEL_TXT[profile.nivel], profile.sistema ? "uso " + profile.sistema : ""].filter(Boolean).join("; ") + ".");
      if (profile.herramientas && det.types.some((x) => TECH.includes(x.id))) context.push("Herramientas que uso: " + profile.herramientas + ".");
      if (profile.rutas && isCode) context.push("Mis rutas habituales: " + profile.rutas + ".");
    }
    iv.remembered.forEach((r) => { if (!(useProfile && r.value === profile.sistema)) context.push(r.label + ": " + r.value + "."); });
    slot("environment").concat(slot("context")).forEach((q) => context.push(q.k + ": " + q.a + "."));

    const objective = slot("purpose").map((q) => q.a).join(". ");
    const audienceA = slot("audience").map((q) => q.a).join(". ");
    const audience = audienceA || (useProfile && profile.rol ? "Yo: " + profile.rol + ", nivel técnico " + NIVEL_TXT[profile.nivel] + "." : "");
    const input = det.input.slice().concat(slot("input").map((q) => q.k + ": " + q.a));
    const constraints = slot("constraints").map((q) => q.k + ": " + q.a + ".")
      .concat(useProfile && profile.noQuiero ? ["No hagas: " + profile.noQuiero + "."] : [])
      .concat(chips.filter((c) => c.kind === "constraint").map((c) => c.text));
    const style = chips.filter((c) => c.kind === "style").map((c) => c.text).concat(usePrefs && prefs.styleText ? [prefs.styleText] : []);
    const tone = slot("tone").map((q) => q.a).join(". ");
    const fmtAnswer = slot("format").map((q) => q.a).join(". ");
    const baseFormat = fmtAnswer || (det.has.format ? "Respeta el formato que pido en la tarea." : t.format || LEVEL_FORMAT[det.level]);
    const format = [baseFormat].concat(chips.filter((c) => c.kind === "format").map((c) => c.text));
    const success = slot("success").map((q) => q.a).join(". ");
    const pending = iv.questions.length - answered.length;
    const instructions = t.instructions.slice();
    if (det.level >= 3 || (pending > 0 && det.level >= 2)) instructions.push("Si falta un dato clave, pregúntame una sola vez antes de empezar.");

    return {
      role: det.has.role ? "" : t.role, task: det.clean, context, objective, audience, input, instructions,
      constraints, style, tone, format, success, examples: choice.examples, cot: choice.cot, framework: choice.framework,
      envKnown: slot("environment").length > 0 || iv.remembered.some((r) => r.slot === "environment") || (hasProfile(profile) && !!profile.sistema),
      answerWords: answered.reduce((n, q) => n + countWords(q.a), 0), answered, pending, typeName: t.name,
    };
  }

  // ---------- 11. Compiladores de marco ----------
  const numbered = (list) => list.map((x, i) => i + 1 + ". " + x).join("\n");
  const bullets = (list) => list.map((x) => "- " + x).join("\n");
  const tag = (name, body) => (body && String(body).trim() ? "<" + name + ">\n" + String(body).trim() + "\n</" + name + ">" : "");

  function compileXML(s) {
    const ctxLines = s.context.slice();
    if (s.objective) ctxLines.push("Objetivo: " + s.objective);
    if (s.audience) ctxLines.push("Audiencia: " + s.audience);
    const rules = s.constraints.slice();
    if (s.tone) rules.push("Tono: " + s.tone + ".");
    s.style.forEach((x) => rules.push(x));
    const outFmt = s.format.slice();
    if (s.success) outFmt.push("Estará bien si: " + s.success);
    const ex = s.examples.length
      ? "Usa estos ejemplos solo como referencia de estilo y nivel de detalle; no los copies.\n" +
        s.examples.map((e) => "<example>\n<request>" + e.request + "</request>\n<ideal_response>\n" + e.response + "\n</ideal_response>\n</example>").join("\n")
      : "";
    const parts = [
      s.role ? tag("role", "Eres " + s.role + ".") : "",
      tag("context", bullets(ctxLines)),
      tag("task", s.task),
      tag("input_data", s.input.join("\n\n")),
      tag("instructions", numbered(s.instructions)),
      tag("constraints", bullets(rules)),
      tag("examples", ex),
      tag("output_format", bullets(outFmt)),
      s.cot ? "Antes de responder, razona paso a paso dentro de <thinking>. Luego entrega solo la respuesta final dentro de <answer>." : "",
    ];
    return parts.filter(Boolean).join("\n\n");
  }

  function compileCOSTAR(s) {
    const sec = (title, body) => (body && String(body).trim() ? "# " + title + "\n" + String(body).trim() : "");
    const context = (s.role ? "Actúa como " + s.role + ".\n" : "") + bullets(s.context) +
      (s.input.length ? "\nDatos:\n" + s.input.join("\n\n") : "");
    const objective = s.task + (s.objective ? "\nPara qué: " + s.objective : "") + "\n" + numbered(s.instructions);
    const parts = [
      sec("CONTEXTO", context),
      sec("OBJETIVO", objective),
      sec("ESTILO", s.style.join(" ") || "Claro, directo y práctico."),
      sec("TONO", s.tone || (s.typeName === "Redacción" ? "Profesional y cercano." : "Técnico y directo.")),
      sec("AUDIENCIA", s.audience),
      sec("RESPUESTA", bullets(s.format.concat(s.success ? ["Estará bien si: " + s.success] : []))),
      sec("RESTRICCIONES", bullets(s.constraints)),
      sec("EJEMPLOS", s.examples.map((e, i) => "Ejemplo " + (i + 1) + "\nPedido: " + e.request + "\nRespuesta ideal:\n" + e.response).join("\n\n") +
        (s.examples.length ? "\n(Úsalos como referencia de estilo; no los copies.)" : "")),
      s.cot ? "Piensa paso a paso antes de responder y entrega solo el resultado final." : "",
    ];
    return parts.filter(Boolean).join("\n\n");
  }

  function compileCompact(s) {
    const lines = [(s.role ? "Actúa como " + s.role + ". " : "") + s.task];
    if (s.context.length) lines.push("Contexto: " + s.context.join(" "));
    if (s.input.length) lines.push("Datos:\n" + s.input.join("\n"));
    if (s.objective) lines.push("Para qué: " + s.objective);
    if (s.audience) lines.push("Para quién: " + s.audience);
    lines.push("Formato: " + s.format.join(" "));
    const rules = s.constraints.concat(s.style).concat(s.tone ? ["Tono: " + s.tone + "."] : []);
    if (rules.length) lines.push("Reglas: " + rules.join(" "));
    if (s.success) lines.push("Estará bien si: " + s.success);
    if (s.examples.length) lines.push("Ejemplo de respuesta que me gusta:\n" + s.examples[0].response);
    if (s.cot) lines.push("Piensa paso a paso y entrega solo el resultado final.");
    return lines.join("\n");
  }
  const COMPILERS = { xml: compileXML, costar: compileCOSTAR, compact: compileCompact };

  // ---------- 12. Consejos ----------
  const fmt = (n) => Number(n || 0).toLocaleString("es-CO");
  function tips(r) {
    const out = [];
    if (r.context >= 40000) out.push("Este chat ya es muy largo: cada mensaje reenvía ~" + fmt(r.context) + " tokens de historial. Pide un resumen y abre un chat nuevo con él.");
    else if (r.context >= 15000) out.push("El historial ya pesa ~" + fmt(r.context) + " tokens por mensaje. Si cambias de tema, abre un chat nuevo.");
    const top = r.provider === "claude" ? "Opus" : "el modelo más potente";
    if (r.level <= 2) out.push("No uses " + top + " ni modos de pensamiento alto para esto: gastarías varias veces más límite por la misma respuesta.");
    if (r.level === 4) out.push(r.provider === "claude" ? "Antes de usar Opus, prueba en Sonnet con pensamiento extendido. Usa Opus solo si falla." : "Antes del nivel más alto, prueba con el anterior. Sube solo si la respuesta falla.");
    if (r.cot && r.level >= 3) out.push("Si activas el pensamiento extendido de la app, borra la línea de «razona paso a paso»: el modelo ya razona y pagarías dos veces.");
    if (r.examplesTokens > 600) out.push("Tus ejemplos favoritos suman ~" + fmt(r.examplesTokens) + " tokens. Desactívalos para pedidos rápidos.");
    if (r.usedProfile) out.push("Pega tu perfil una vez en la personalización de la app y marca «Ya lo puse en la app»: así no lo repites en cada prompt.");
    if (r.pending > 0) out.push("Responde las preguntas de la entrevista: un dato que falta suele costar 2 o 3 mensajes de aclaración, y cada uno reenvía todo el historial.");
    out.push("Pide solo el fragmento que cambia cuando el cambio sea pequeño.");
    out.push("Junta tus preguntas en un solo mensaje.");
    return out.slice(0, 4);
  }

  // ---------- 13. Ejecución completa ----------
  function run(input) {
    const i = input || {};
    const memory = i.memory || sanitizeMemory(null);
    const prefs = memory.prefs, profile = memory.profile;
    const provider = PROVIDERS[i.provider] ? i.provider : prefs.provider;
    const det = detect(i.text);
    const iv = interview(det, { facts: memory.facts, profile });
    const fw = chooseFramework(i.framework || prefs.framework, det, provider, memory.favorites);
    const cot = chooseCot(i.cot || prefs.cot, det);
    const examples = selectExamples(det, memory.favorites, prefs.useExamples);
    const spec = buildSpec(det, iv, { profile, prefs, answers: i.answers }, { framework: fw.id, cot: cot.on, examples });
    const prompt = det.empty ? "" : COMPILERS[fw.id](spec);
    const appl = applicability(det);
    const original = evaluate(featuresFromText(det), appl);
    const improved = det.empty ? original : evaluate(featuresFromSpec(spec, det), appl);
    const p = PROVIDERS[provider];
    const rec = p.levels[det.level];
    const contextTokens = Math.max(0, Number(i.contextMessages) || 0) * 900;
    const thinking = THINK[det.level] + (cot.on && !THINK[det.level] ? 600 : 0);
    const tokens = {
      original: estimateTokens(det.raw), improved: estimateTokens(prompt), context: contextTokens,
      output: OUT[det.level], thinking,
    };
    tokens.total = tokens.improved + tokens.context + tokens.output + tokens.thinking;
    const examplesTokens = estimateTokens(examples.map((e) => e.request + e.response).join("\n"));
    const usedProfile = hasProfile(profile) && !profile.enApp && det.level >= 2;
    return {
      empty: det.empty, detection: det, level: det.level, levelInfo: det.levelInfo, why: det.why,
      type: det.primary, types: det.types, provider, providerLabel: p.label, providerNote: p.note, rec,
      vsOpus: provider === "claude" && det.level < 4 ? Math.round(PROVIDERS.claude.levels[4].price / rec.price) : null,
      framework: Object.assign({}, FRAMEWORKS[fw.id], { reason: fw.reason }), cot,
      interview: iv, spec, prompt, original, improved, tokens, examples, examplesTokens,
      tips: tips({ provider, level: det.level, context: contextTokens, cot: cot.on, examplesTokens, usedProfile, pending: spec.pending }),
    };
  }

  // ---------- 14. Aprendizaje ----------
  function entryFrom(result, promptText, answers) {
    return {
      id: newId(), ts: Date.now(), idea: result.detection.raw, prompt: promptText, type: result.type.id,
      framework: result.framework.id, cot: result.cot.on, provider: result.provider, score: result.improved.score,
      level: result.level, keywords: result.detection.keywords,
      answers: Object.assign({}, ...result.spec.answered.map((q) => ({ [q.id]: answers[q.id] || q.a }))),
    };
  }
  // Se llama al copiar o exportar: historial + estadísticas + datos que se recuerdan.
  function recordUse(memory, result, promptText, answers) {
    const m = sanitizeMemory(memory);
    if (result.empty) return m;
    const e = entryFrom(result, promptText, answers || {});
    m.history = [e].concat(m.history.filter((h) => !(h.idea === e.idea && h.prompt === e.prompt))).slice(0, 50);
    const s = m.stats;
    s.n += 1; s.levels[result.level] += 1; s.words += result.detection.words;
    // El rol lo agrega siempre el asesor: no cuenta como un hábito a corregir.
    result.original.missing.forEach((c) => { if (c.id !== "role") s.missing[c.id] = (s.missing[c.id] || 0) + 1; });
    result.types.forEach((t) => { s.topics[t.id] = (s.topics[t.id] || 0) + 1; });
    s.frameworks[result.framework.id] = (s.frameworks[result.framework.id] || 0) + 1;
    result.spec.answered.forEach((q) => { if (q.fact && q.a) m.facts[q.fact] = q.a.slice(0, 300); });
    return m;
  }
  // "Aprender de este prompt": se guarda como favorito; con la respuesta que te gustó se vuelve ejemplo (few-shot).
  function addFavorite(memory, result, promptText, answers, answer, note) {
    const m = sanitizeMemory(memory);
    if (result.empty) return m;
    const e = entryFrom(result, promptText, answers || {});
    e.answer = String(answer || "").slice(0, 4000);
    e.note = String(note || "").slice(0, 300);
    m.favorites = [e].concat(m.favorites.filter((f) => !(f.idea === e.idea && f.prompt === e.prompt))).slice(0, 100);
    m.stats.likes += 1;
    result.spec.answered.forEach((q) => { if (q.fact && q.a) m.facts[q.fact] = q.a.slice(0, 300); });
    return m;
  }

  function insights(memory) {
    const m = sanitizeMemory(memory);
    const s = m.stats, out = [];
    if (s.n >= 3) {
      const pct = Math.round(((s.n - s.levels[4]) / s.n) * 100);
      const easy = (s.levels[1] + s.levels[2]) / s.n;
      out.push(pct + " % de tus " + s.n + " pedidos no necesitaba Opus. " + (easy >= 0.6 ? "Tu modelo base debería ser Sonnet (o Haiku para lo simple)." : "Usa Sonnet con pensamiento extendido como base y Opus solo cuando falle."));
      const miss = Object.keys(s.missing).sort((a, b) => s.missing[b] - s.missing[a])[0];
      const check = CHECKS.find((c) => c.id === miss);
      if (check && s.missing[miss] / s.n >= 0.5) out.push("Casi siempre te falta «" + check.label + "» (" + s.missing[miss] + " de " + s.n + "). " + check.fix);
      const avg = Math.round(s.words / s.n);
      if (avg < 12) out.push("Tus ideas son muy cortas (" + avg + " palabras en promedio). Con 2 o 3 datos más la IA acierta a la primera.");
      if (avg > 250) out.push("Tus ideas son largas (" + avg + " palabras en promedio). Quita lo que no cambia la respuesta.");
    }
    const topic = Object.keys(s.topics).sort((a, b) => s.topics[b] - s.topics[a])[0];
    const tp = TYPES.find((t) => t.id === topic);
    if (tp && s.topics[topic] >= 2) out.push("Tu tema más frecuente: " + tp.name + " (" + s.topics[topic] + " pedidos).");
    const withAnswer = m.favorites.filter((f) => f.answer).length;
    if (withAnswer) out.push("Tienes " + withAnswer + (withAnswer === 1 ? " ejemplo favorito" : " ejemplos favoritos") + " con respuesta: los uso como referencia en pedidos parecidos.");
    else if (m.favorites.length) out.push("Agrega a tus favoritos la respuesta que te dio la IA: así se vuelven ejemplos que mejoran tus próximos prompts.");
    return out;
  }

  // ---------- 15. Exportar e importar ----------
  function toMarkdown(result, promptText) {
    const fence = promptText.includes("```") ? "~~~~" : "```";
    const lines = [
      "# Prompt mejorado — Asesor IA", "",
      "- Fecha: " + new Date().toLocaleString("es-CO"),
      "- App: " + result.providerLabel + " · modelo recomendado: " + result.rec.model + " (" + result.rec.mode + ")",
      "- Marco: " + result.framework.name + " · razonamiento paso a paso: " + (result.cot.on ? "sí" : "no"),
      "- Puntaje: " + result.original.score + " → " + result.improved.score + " / 100",
      "- Tokens del prompt: ~" + result.tokens.improved, "",
      "## Prompt mejorado", "", fence + "text", promptText, fence, "",
      "## Idea original", "", result.detection.raw.trim(), "",
    ];
    if (result.improved.missing.length) {
      lines.push("## Qué le falta todavía", "");
      result.improved.missing.forEach((c) => lines.push("- **" + c.label + ":** " + c.fix));
      lines.push("");
    }
    return lines.join("\n");
  }
  function toJSON(result, promptText, answers) {
    return JSON.stringify({
      app: "Asesor IA", version: 3, createdAt: new Date().toISOString(),
      provider: result.provider, model: result.rec.model, mode: result.rec.mode,
      framework: result.framework.id, chainOfThought: result.cot.on, level: result.level, type: result.type.id,
      score: { original: result.original.score, improved: result.improved.score, dimensions: result.improved.dims },
      idea: result.detection.raw, answers: answers || {}, prompt: promptText,
      missing: result.improved.missing.map((c) => ({ id: c.id, label: c.label, fix: c.fix })),
      tokens: result.tokens,
    }, null, 2);
  }
  function exportCode(memory) {
    const m = sanitizeMemory(memory);
    const json = JSON.stringify({ v: 3, profile: m.profile, prefs: m.prefs, facts: m.facts, stats: m.stats, favorites: m.favorites, templates: m.templates });
    return "ASESOR3:" + btoa(unescape(encodeURIComponent(json)));
  }
  // Acepta ASESOR3 (esta versión), ASESOR1 (versión anterior) o un .json exportado.
  function importData(memory, raw) {
    const text = String(raw || "").trim();
    let data;
    const code = /ASESOR([13]):([A-Za-z0-9+/=]+)/.exec(text.replace(/\s+/g, ""));
    if (code) {
      try { data = JSON.parse(decodeURIComponent(escape(atob(code[2])))); } catch (e) { throw new Error("El código está incompleto. Cópialo otra vez completo."); }
      if (code[1] === "1") data = { profile: data.profile, facts: data.learned && data.learned.facts, stats: data.learned, prefs: data.profile && data.profile.estilo ? { styleText: data.profile.estilo } : null };
    } else if (text.charAt(0) === "{") {
      try { data = JSON.parse(text); } catch (e) { throw new Error("El archivo no es un JSON válido."); }
    } else {
      throw new Error("No reconozco el formato. Pega un código ASESOR3: o un archivo .json exportado desde aquí.");
    }
    if (!isObj(data)) throw new Error("El contenido está vacío.");
    const cur = sanitizeMemory(memory), inc = sanitizeMemory(data);
    const mergeById = (a, b, max) => { const seen = new Set(); return b.concat(a).filter((x) => (seen.has(x.id) ? false : seen.add(x.id))).slice(0, max); };
    return sanitizeMemory({
      prefs: data.prefs ? sanitizePrefs(Object.assign({}, cur.prefs, data.prefs)) : cur.prefs,
      profile: data.profile ? inc.profile : cur.profile,
      facts: Object.assign({}, cur.facts, inc.facts),
      stats: data.stats ? inc.stats : cur.stats,
      history: mergeById(cur.history, inc.history, 50),
      favorites: mergeById(cur.favorites, inc.favorites, 100),
      templates: mergeById(cur.templates, inc.templates, 50),
    });
  }

  const TEMPLATES = [
    { id: "t_ps", name: "Script de PowerShell", text: "Hazme un script en PowerShell 7 que [qué debe hacer] y guarde el resultado en [ruta]. Debe funcionar en Windows [versión] y ejecutarse [como administrador o no]." },
    { id: "t_err", name: "Depurar un error", text: "Mi [programa o flujo] falla con este error:\n[pega el error exacto]\nPasa cuando [qué haces]. Ya intenté [qué probaste]." },
    { id: "t_n8n", name: "Flujo de n8n", text: "Quiero un flujo de n8n que se active con [disparador], haga [pasos] y envíe el resultado a [destino]. Mi n8n es [nube o local, versión]." },
    { id: "t_web", name: "Página web", text: "Crea una página web para [para qué], dirigida a [público]. Debe tener [secciones]. Colores: [colores]. La publicaré en [dónde]." },
    { id: "t_mail", name: "Correo profesional", text: "Redacta un correo [formal o cercano] para [destinatario] pidiendo [qué]. Máximo [N] líneas." },
    { id: "t_learn", name: "Aprender un tema", text: "Explícame [tema] para alguien de nivel [básico o intermedio], con un ejemplo práctico y un ejercicio corto." },
    { id: "t_hw", name: "Diagnóstico de un equipo", text: "Mi [equipo, marca y modelo] tiene este síntoma: [qué pasa]. Sistema: [sistema]. Cuento con estas herramientas: [herramientas]." },
  ];

  root.AsesorEngine = {
    run, detect, evaluate, interview, estimateTokens, cleanText, keywords, similarity,
    recordUse, addFavorite, insights, personalText, sanitizeMemory, sanitizeProfile, sanitizePrefs, migrateLegacy,
    toMarkdown, toJSON, exportCode, importData, hasProfile, fmt, newId,
    PROVIDERS, FRAMEWORKS, STYLE_CHIPS, TEMPLATES, WHERE_TO_PASTE, CHECKS, DIMS, TYPES,
  };
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>

<script id="app">
// La arranca el cargador (al final del archivo) cuando React y htm ya están disponibles.
window.__startApp = function () {
  "use strict";
  var rootEl = document.getElementById("root");
  const { useState, useEffect, useMemo, useRef, useCallback } = React;
  const html = htm.bind(React.createElement);
  const E = window.AsesorEngine;
  const SAMPLE = "Hazme un script en PowerShell 7 que liste los programas instalados y los guarde en C:\\Reportes\\programas.csv";
  const MEM_KEY = "asesor.v3", DRAFT_KEY = "asesor.v3.draft", TAB_KEY = "asesor.v3.tab";

  // ---------- Almacenamiento local (con try/catch: puede no estar disponible) ----------
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  };
  function loadMemory() {
    const cur = LS.get(MEM_KEY, null);
    if (cur) return E.sanitizeMemory(cur);
    return E.migrateLegacy({ profile: LS.get("asesor.profile", null), learned: LS.get("asesor.learned", null), app: LS.get("asesor.app", null) });
  }
  function loadDraft() {
    const d = LS.get(DRAFT_KEY, null);
    if (d && typeof d.idea === "string") return { idea: d.idea, answers: d.answers && typeof d.answers === "object" ? d.answers : {}, ctx: Number(d.ctx) || 0 };
    const legacy = LS.get("asesor.draft", "");
    return { idea: typeof legacy === "string" && legacy.trim() ? legacy : SAMPLE, answers: {}, ctx: 0 };
  }

  // ---------- Portapapeles y descargas ----------
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand("copy"); ta.remove(); return ok;
      } catch (e2) { return false; }
    }
  }
  let downloadsPromise = null;
  function getDownloads() {
    if (!downloadsPromise) {
      downloadsPromise = window.claude && typeof window.claude.use === "function"
        ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
    }
    return downloadsPromise;
  }
  async function saveFile(filename, content, mime) {
    const d = await getDownloads();
    if (d) {
      try { await d.save({ filename, data: content }); return "Archivo guardado: " + filename; }
      catch (e) {
        const code = e && e.code;
        if (code === "declined") return "Descarga cancelada.";
        if (code === "rate_limited") return "Ya hay una descarga pendiente. Espera un momento.";
        return "Aquí no se pudo descargar. Usa «Copiar».";
      }
    }
    try {
      const url = URL.createObjectURL(new Blob([content], { type: mime }));
      const a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
      return "Descarga iniciada: " + filename + ". Si no aparece, usa «Copiar».";
    } catch (e) { return "No se pudo descargar. Usa «Copiar»."; }
  }

  // ---------- Voz: reconocimiento continuo + síntesis ----------
  const FATAL = new Set(["not-allowed", "service-not-allowed", "audio-capture", "network", "language-not-supported", "unsupported"]);
  function micMessage(code) {
    if (code === "not-allowed" || code === "service-not-allowed") return "El micrófono está bloqueado aquí. Dentro de claude.ai los artefactos no pueden usarlo: usa el micrófono de tu teclado (Gboard) o abre la versión instalada.";
    if (code === "audio-capture") return "No encuentro un micrófono conectado.";
    if (code === "network") return "El dictado de Chrome necesita internet.";
    if (code === "language-not-supported") return "Tu navegador no reconoce ese idioma. Cambia el idioma de voz en Perfil.";
    if (code === "unsupported") return "Este navegador no tiene dictado por voz. Usa Chrome o el micrófono del teclado.";
    return "No se pudo usar el micrófono (" + code + ").";
  }
  const Voice = (() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const state = { supported: !!SR, tts: "speechSynthesis" in window, listening: false, hearing: false, speaking: false, interim: "", target: null, error: "" };
    const subs = new Set();
    const emit = () => subs.forEach((f) => f(Object.assign({}, state)));
    let rec = null, keep = false, opts = {}, silenceTimer = null, gotFinal = false, restarts = [];
    let sessionFinal = "";

    function run() {
      rec = new SR();
      rec.lang = opts.lang || "es-CO";
      rec.continuous = true;      // no se corta en las pausas
      rec.interimResults = true;  // texto parcial en vivo
      rec.maxAlternatives = 1;
      sessionFinal = "";
      rec.onstart = () => { state.listening = true; state.error = ""; emit(); };
      rec.onspeechstart = () => { state.hearing = true; emit(); };
      rec.onspeechend = () => { state.hearing = false; emit(); };
      rec.onresult = (e) => {
        let interim = "", fin = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) fin += t; else interim += t;
        }
        if (fin) {
          // Chrome en Android a veces repite lo ya reconocido: solo se agrega lo nuevo.
          let add = fin.trim();
          if (sessionFinal && add.toLowerCase().indexOf(sessionFinal.toLowerCase()) === 0) add = add.slice(sessionFinal.length).trim();
          sessionFinal = (sessionFinal + " " + add).trim();
          if (add && opts.onFinal) opts.onFinal(add);
          gotFinal = true;
        }
        state.interim = interim.trim();
        state.hearing = true;
        emit();
        armSilence();
      };
      rec.onerror = (e) => {
        const code = e.error || "error";
        if (code === "no-speech" || code === "aborted") return;
        state.error = code;
        if (FATAL.has(code)) keep = false;
        emit();
      };
      rec.onend = () => {
        state.hearing = false; state.interim = "";
        const now = Date.now();
        restarts = restarts.filter((t) => now - t < 4000);
        if (keep && restarts.length < 5) {
          // Chrome corta el reconocimiento tras silencios largos: se reanuda solo.
          restarts.push(now);
          setTimeout(() => { if (keep) { try { run(); } catch (err) { finish(); } } }, 200);
          emit();
          return;
        }
        finish();
      };
      try { rec.start(); } catch (err) { state.error = "busy"; keep = false; finish(); }
    }
    function finish() {
      clearTimeout(silenceTimer);
      const err = state.error;
      state.listening = false; state.hearing = false; state.interim = ""; state.target = null;
      rec = null; emit();
      const cb = opts.onEnd; opts = {};
      if (cb) cb(FATAL.has(err) ? err : "");
    }
    function armSilence() {
      clearTimeout(silenceTimer);
      if (opts.silenceMs && gotFinal) silenceTimer = setTimeout(() => stop(), opts.silenceMs);
    }
    function start(o) {
      if (!SR) { if (o.onEnd) o.onEnd("unsupported"); return; }
      if (rec) { const prev = opts.onEnd; opts.onEnd = null; keep = false; try { rec.abort(); } catch (e) {} rec = null; if (prev) prev(""); }
      cancelSpeak();
      opts = o; keep = true; gotFinal = false; restarts = []; state.error = ""; state.target = o.target || null;
      emit();
      run();
    }
    function stop() {
      keep = false; clearTimeout(silenceTimer);
      if (rec) { try { rec.stop(); } catch (e) { finish(); } } else if (state.listening) finish();
    }
    let voices = [];
    const loadVoices = () => { try { voices = speechSynthesis.getVoices(); } catch (e) { voices = []; } };
    if (state.tts) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
    function speak(text, lang, rate) {
      return new Promise((resolve) => {
        if (!state.tts || !text) { resolve(); return; }
        try {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = lang || "es-CO"; u.rate = rate || 1;
          const es = voices.filter((v) => /^es/i.test(v.lang));
          const pick = es.find((v) => v.lang.replace("_", "-") === u.lang) || es.find((v) => /419|MX|US|CO/.test(v.lang)) || es[0];
          if (pick) u.voice = pick;
          let done = false;
          const end = () => { if (!done) { done = true; state.speaking = false; emit(); resolve(); } };
          u.onend = end; u.onerror = end;
          state.speaking = true; emit();
          speechSynthesis.speak(u);
          setTimeout(end, Math.min(45000, 2000 + text.length * 95)); // por si el navegador nunca avisa el final
        } catch (e) { state.speaking = false; emit(); resolve(); }
      });
    }
    function cancelSpeak() { if (state.tts) { try { speechSynthesis.cancel(); } catch (e) {} } if (state.speaking) { state.speaking = false; emit(); } }

  // ---------- Aplicación ----------
  function App() {
    const [memory, setMemory] = useState(loadMemory);
    const [draft, setDraftState] = useState(loadDraft);
    const [tab, setTab] = useState(() => { const t = LS.get(TAB_KEY, "crear"); return ["crear", "biblioteca", "perfil"].includes(t) ? t : "crear"; });
    const [edited, setEdited] = useState(null);
    const [toast, setToast] = useState(null);
    const [conv, setConv] = useState(null);
    const voice = useVoice();
    const draftRef = useRef(draft), memRef = useRef(memory), convRef = useRef(null);
    memRef.current = memory;

    const notify = useCallback((msg) => { if (!msg) return; setToast({ msg, id: Date.now() }); }, []);
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3500); return () => clearTimeout(t); }, [toast]);
    const warnedRef = useRef(false);
    useEffect(() => {
      const t = setTimeout(() => {
        if (!LS.set(MEM_KEY, memory) && !warnedRef.current) { warnedRef.current = true; notify("No pude guardar en este navegador (almacenamiento lleno o bloqueado). Lo de esta sesión se perderá al cerrar."); }
      }, 250);
      return () => clearTimeout(t);
    }, [memory]);
    useEffect(() => { const t = setTimeout(() => LS.set(DRAFT_KEY, draft), 250); return () => clearTimeout(t); }, [draft]);
    useEffect(() => { LS.set(TAB_KEY, tab); }, [tab]);
    useEffect(() => { getDownloads(); }, []);

    // Actualiza el borrador de forma síncrona en la ref (la conversación por voz lo lee al instante).
    const updateDraft = useCallback((fn) => { const next = fn(draftRef.current); draftRef.current = next; setDraftState(next); }, []);
    const update = useCallback((fn) => setMemory((m) => E.sanitizeMemory(fn(m))), []);
    const setPrefs = useCallback((patch) => update((m) => Object.assign({}, m, { prefs: Object.assign({}, m.prefs, patch) })), [update]);
    const prefs = memory.prefs;

    const r = useMemo(() => E.run({ text: draft.idea, answers: draft.answers, contextMessages: draft.ctx, memory }), [draft, memory]);
    useEffect(() => { setEdited(null); }, [r.prompt]);
    const promptText = edited != null ? edited : r.prompt;
    const runNow = () => E.run({ text: draftRef.current.idea, answers: draftRef.current.answers, contextMessages: draftRef.current.ctx, memory: memRef.current });

    const join = (a, b) => (a && a.trim() ? a.replace(/\s+$/, "") + " " : "") + b;
    const appendTo = (target, text) => updateDraft((d) => target === "idea"
      ? Object.assign({}, d, { idea: join(d.idea === SAMPLE ? "" : d.idea, text) })
      : Object.assign({}, d, { answers: Object.assign({}, d.answers, { [target]: join(d.answers[target] || "", text) }) }));
    const speak = (text) => Voice.speak(text, memRef.current.prefs.voiceLang, memRef.current.prefs.voiceRate);

    function listen(target, silenceMs) {
      return new Promise((resolve, reject) => {
        Voice.start({ lang: memRef.current.prefs.voiceLang, target, silenceMs, onFinal: (t) => appendTo(target, t),
          onEnd: (err) => (err ? reject(new Error(micMessage(err))) : resolve()) });
      });
    }
    const toggleListen = (target, silenceMs) => {
      if (voice.listening && voice.target === target) { Voice.stop(); return; }
      if (target === "idea" && draftRef.current.idea === SAMPLE) updateDraft((d) => Object.assign({}, d, { idea: "", answers: {} }));
      listen(target, silenceMs).catch((e) => notify(e.message));
    };

    const summary = (res) => "Tarea " + res.levelInfo.name.toLowerCase() + ". En " + res.providerLabel + " usa " + res.rec.model + ". " +
      res.rec.mode.split("·")[0].trim() + ". Tu idea tiene " + res.original.score + " puntos de 100; el prompt mejorado, " + res.improved.score + ".";

    // Conversación: cuentas tu idea de corrido → resumen hablado → preguntas una a una → resultado.
    async function converse() {
      if (convRef.current) { convRef.current.cancelled = true; Voice.stop(); Voice.cancelSpeak(); convRef.current = null; setConv(null); return; }
      const token = { cancelled: false };
      convRef.current = token;
      const guard = () => { if (token.cancelled) throw new Error(""); };
      const say = async (t) => { if (memRef.current.prefs.autoRead) { await speak(t); guard(); } };
      try {
        setConv({ step: "idea" });
        const idea = draftRef.current.idea;
        if (!idea.trim() || idea === SAMPLE) {
          updateDraft((d) => Object.assign({}, d, { idea: "", answers: {} }));
          await say("Cuéntame tu idea. Habla con calma; las pausas no me cortan. Cuando termines, toca Listo.");
          if (Voice.state.supported) { await listen("idea", 0); guard(); }
          else { notify("Este navegador no tiene dictado: escribe tu idea y vuelve a tocar «Refinar conversando»."); throw new Error(""); }
        }
        let res = runNow();
        if (res.empty) { notify("No escuché ninguna idea. Intenta de nuevo."); throw new Error(""); }
        const qs = res.interview.questions.filter((q) => !(draftRef.current.answers[q.id] || "").trim());
        await say(summary(res) + (qs.length ? " Te haré " + (qs.length === 1 ? "una pregunta." : qs.length + " preguntas.") : ""));
        for (const q of qs) {
          guard();
          setConv({ step: "q", qid: q.id });
          await say(q.q);
          if (Voice.state.supported) { await listen(q.id, memRef.current.prefs.autoAdvance ? 4000 : 0); guard(); }
        }
        res = runNow();
        await say("Listo. Tu prompt mejorado tiene " + res.improved.score + " puntos de 100. Revísalo y cópialo.");
        notify("Conversación terminada: el prompt ya tiene tus respuestas.");
      } catch (e) {
        if (e && e.message) notify(e.message);
      } finally {
        if (convRef.current === token) { convRef.current = null; setConv(null); }
      }
    }

    const readQuestions = async () => {
      for (const q of r.interview.questions) { await speak(q.q); }
    };
    const record = () => update((m) => E.recordUse(m, r, promptText, draft.answers));
    const onCopy = async () => {
      if (r.empty) { notify("Escribe primero tu idea."); return; }
      const ok = await copyText(promptText);
      notify(ok ? "Copiado. Pégalo en " + r.providerLabel + " con " + r.rec.model + "." : "No se pudo copiar: selecciona el texto y cópialo a mano.");
      if (ok) record();
    };
    const onExport = async (kind) => {
      if (r.empty) { notify("Escribe primero tu idea."); return; }
      const stamp = new Date().toISOString().slice(0, 10);
      const msg = kind === "md"
        ? await saveFile("prompt-" + stamp + ".md", E.toMarkdown(r, promptText), "text/markdown")
        : await saveFile("prompt-" + stamp + ".json", E.toJSON(r, promptText, draft.answers), "application/json");
      notify(msg); record();
    };
    const onLike = (answer) => {
      if (r.empty) return;
      update((m) => E.addFavorite(E.recordUse(m, r, promptText, draft.answers), r, promptText, draft.answers, answer, ""));
      notify(answer.trim() ? "Aprendido: lo usaré como ejemplo en pedidos parecidos." : "Guardado en favoritos. Agrega la respuesta de la IA para que sea un ejemplo.");
    };
    const onSaveTemplate = (name) => {
      update((m) => Object.assign({}, m, { templates: [{ id: E.newId(), name, text: draft.idea, ts: Date.now() }].concat(m.templates) }));
      notify("Plantilla guardada en tu biblioteca.");
    };
    const loadIdea = (idea, answers) => { updateDraft((d) => Object.assign({}, d, { idea, answers: answers || {} })); setTab("crear"); window.scrollTo({ top: 0, behavior: "smooth" }); };

    const TABS = [["crear", "Crear", "Wand2"], ["biblioteca", "Biblioteca", "Library"], ["perfil", "Perfil y memoria", "User"]];
    return html`<div className="grid gap-4 font-sans text-ink">
      <header className="grid gap-3">
        <div className="flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 className="font-display text-3xl font-extrabold tracking-tight m-0 flex items-center gap-2"><${Icon} name="Sparkles" size=${26} className="text-acc" />Asesor IA</h1>
            <p className="text-mute m-0">Convierte tu idea en un prompt profesional y gasta menos límite de uso.</p>
          </div>
          <fieldset className="flex flex-wrap gap-1.5 border-0 p-0 m-0">
            <legend className="sr-only">App donde lo vas a pedir</legend>
            ${PROVIDER_IDS.map((id) => html`<button key=${id} type="button" aria-pressed=${prefs.provider === id} onClick=${() => setPrefs({ provider: id })}
              className=${"rounded-full border px-3 py-1.5 text-sm font-bold transition " + (prefs.provider === id ? "border-ink bg-ink text-canvas" : "border-line bg-raised text-ink hover:bg-line")}>${E.PROVIDERS[id].label}</button>`)}
          </fieldset>
        </div>
        <nav className="flex gap-1 overflow-x-auto border-b border-line" aria-label="Secciones">
          ${TABS.map(([id, label, icon]) => html`<button key=${id} type="button" onClick=${() => setTab(id)} aria-current=${tab === id ? "page" : undefined}
            className=${"-mb-px flex shrink-0 items-center gap-2 whitespace-nowrap border-b-2 px-3 py-2 text-sm font-bold transition " + (tab === id ? "border-acc text-ink" : "border-transparent text-mute hover:text-ink")}>
            <${Icon} name=${icon} size=${16} />${label}${id === "biblioteca" && memory.favorites.length ? html`<span className="rounded-full bg-raised px-1.5 text-xs font-mono">${memory.favorites.length}</span>` : null}</button>`)}
        </nav>
      </header>

      ${tab === "crear" && html`<main className="grid gap-4">
        <${IdeaCard} draft=${draft} voice=${voice} conv=${conv} converse=${converse} prefs=${prefs} setPrefs=${setPrefs}
          setIdea=${(v) => updateDraft((d) => Object.assign({}, d, { idea: v }))} setCtx=${(v) => updateDraft((d) => Object.assign({}, d, { ctx: v }))}
          startDictation=${() => toggleListen("idea", 0)} />
        ${r.empty ? html`<${Card}><p className="text-mute m-0">Escribe o dicta tu idea arriba. Te diré qué modelo usar, qué le falta, te haré preguntas y armaré el prompt.</p><//>` : html`<${React.Fragment}>
          <${InterviewCard} r=${r} answers=${draft.answers} voice=${voice} readQuestions=${readQuestions} conv=${conv}
            setAnswer=${(id, v) => updateDraft((d) => Object.assign({}, d, { answers: Object.assign({}, d.answers, { [id]: v }) }))}
            dictateAnswer=${(id) => toggleListen(id, memory.prefs.autoAdvance ? 4000 : 0)} />
          <${ScoreCard} r=${r} />
          <${CompareCard} r=${r} promptText=${promptText} edited=${edited} setEdited=${setEdited}
            onCopy=${onCopy} onCopyOriginal=${async () => notify((await copyText(r.detection.raw)) ? "Original copiado." : "No se pudo copiar.")}
            onExport=${onExport} onLike=${onLike} onSaveTemplate=${onSaveTemplate} />
          <${RecommendCard} r=${r} voice=${voice} speakSummary=${() => speak(summary(r) + (r.interview.questions[0] ? " Primera pregunta: " + r.interview.questions[0].q : ""))} />
          <${TipsCard} r=${r} />
        <//>`}
      </main>`}
      ${tab === "biblioteca" && html`<${LibraryTab} memory=${memory} update=${update} loadIdea=${loadIdea} notify=${notify} />`}
      ${tab === "perfil" && html`<${ProfileTab} memory=${memory} update=${update} setPrefs=${setPrefs} notify=${notify} voice=${voice} />`}

      <footer className="text-xs text-faint">Todo se calcula en tu navegador; el motor no llama a ninguna IA. Modelos según los menús de octubre de 2026.</footer>
      ${toast && html`<div role="status" key=${toast.id}
        className="fixed left-1/2 z-50 w-[min(92vw,520px)] -translate-x-1/2 rounded-xl border border-line bg-raised px-4 py-3 text-sm shadow-2xl"
        style=${{ bottom: "calc(16px + env(safe-area-inset-bottom, 0px))" }}>${toast.msg}</div>`}
    </div>`;
  }

  // Si algo falla al dibujar, se muestra el error en vez de una pantalla vacía.
  class Boundary extends React.Component {
    constructor(props) { super(props); this.state = { error: null }; }
    static getDerivedStateFromError(error) { return { error }; }
    render() {
      if (!this.state.error) return this.props.children;
      return html`<div className="grid gap-3 rounded-2xl border border-bad/60 bg-panel p-5">
        <h2 className="font-display text-lg font-semibold m-0">Algo falló al mostrar el Asesor</h2>
        <p className="text-sm text-mute m-0">Detalle: ${String(this.state.error && this.state.error.message || this.state.error)}</p>
        <div className="flex flex-wrap gap-2">
          <button type="button" className="rounded-lg border border-line bg-raised px-3 py-2 font-bold" onClick=${() => location.reload()}>Recargar</button>
          <button type="button" className="rounded-lg border border-bad/60 bg-raised px-3 py-2 font-bold text-bad"
            onClick=${() => { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} location.reload(); }}>Borrar el borrador y recargar</button>
        </div>
      </div>`;
    }
  }
  ReactDOM.createRoot(rootEl).render(html`<${Boundary}><${App} /><//>`);
};
</script>

<script id="loader">
/*
 * Cargador con respaldo: cada librería se intenta en varios servidores permitidos.
 * Los íconos son opcionales: sin ellos la app funciona igual.
 */
(function () {
  "use strict";
  var rootEl = document.getElementById("root");
  var LIBS = [
    { name: "React", test: function () { return window.React; }, urls: [
      "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
      "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js",
      "https://unpkg.com/react@18.3.1/umd/react.production.min.js"] },
    { name: "ReactDOM", test: function () { return window.ReactDOM; }, urls: [
      "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
      "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js",
      "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"] },
    { name: "htm", test: function () { return window.htm; }, urls: [
      "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js",
      "https://unpkg.com/htm@3.1.1/dist/htm.umd.js"] },
    { name: "íconos (lucide-react)", optional: true, test: function () { return window.LucideReact; },
      before: function () { window.react = window.React; }, // lucide-react UMD busca el global "react"
      urls: [
        "https://cdn.jsdelivr.net/npm/lucide-react@0.263.1/dist/umd/lucide-react.min.js",
        "https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"] },
  ];
  var tried = [];

  function loadScript(url, ms) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      var timer = setTimeout(function () { s.onload = s.onerror = null; reject(new Error("tardó demasiado")); }, ms);
      s.src = url;
      s.onload = function () { clearTimeout(timer); resolve(); };
      s.onerror = function () { clearTimeout(timer); reject(new Error("bloqueado o sin conexión")); };
      document.head.appendChild(s);
    });
  }
  function loadLib(lib) {
    if (lib.before) lib.before();
    if (lib.test()) return Promise.resolve(true);
    var i = 0;
    function next() {
      if (i >= lib.urls.length) return Promise.resolve(false);
      var url = lib.urls[i++];
      return loadScript(url, 10000).then(function () {
        if (lib.test()) return true;
        tried.push(lib.name + ": " + url.split("/")[2] + " cargó pero no definió la librería");
        return next();
      }, function (e) { tried.push(lib.name + ": " + url.split("/")[2] + " " + e.message); return next(); });
    }
    return next();
  }
  function showFailure(missing) {
    rootEl.textContent = "";
    var box = document.createElement("div");
    box.className = "boot";
    var h = document.createElement("p");
    h.style.color = "#e4ebef";
    h.textContent = "No pude cargar: " + missing.join(", ") + ".";
    var why = document.createElement("p");
    why.textContent = "Revisa tu conexión y vuelve a intentar. Si sigue igual, envía este detalle:";
    var pre = document.createElement("pre");
    pre.style.whiteSpace = "pre-wrap"; pre.style.fontSize = "12px";
    pre.textContent = tried.concat(window.__bootErrors || []).join("\n") || "(sin detalle)";
    var btn = document.createElement("button");
    btn.type = "button"; btn.textContent = "Reintentar";
    btn.style.cssText = "padding:8px 14px;border-radius:8px;border:1px solid #f2a541;background:#f2a541;color:#1b1205;font-weight:700";
    btn.addEventListener("click", function () { location.reload(); });
    box.appendChild(h); box.appendChild(why); box.appendChild(pre); box.appendChild(btn);
    rootEl.appendChild(box);
  }
  if (!window.AsesorEngine) { showFailure(["el motor del asesor"]); return; }
  var missing = [];
  LIBS.reduce(function (chain, lib) {
    return chain.then(function () { return loadLib(lib).then(function (ok) { if (!ok && !lib.optional) missing.push(lib.name); }); });
  }, Promise.resolve()).then(function () {
    if (missing.length) { showFailure(missing); return; }
    try { window.__startApp(); } catch (e) { tried.push("interfaz: " + e.message); showFailure(["la interfaz"]); }
  });
})();
</script>
